<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Driver App</title>
<script src="pos-config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#f0f2f5;color:#1a1a2e;height:100vh;overflow:hidden;}
.app{max-width:480px;margin:0 auto;height:100vh;display:flex;
  flex-direction:column;background:#f0f2f5;position:relative;}

/* HEADER */
.header{background:linear-gradient(135deg,#1a1a2e,#2d3561);
  padding:12px 16px;color:#fff;flex-shrink:0;z-index:10;}
.header-row{display:flex;justify-content:space-between;align-items:center;}
.driver-info{display:flex;align-items:center;gap:10px;}
.d-avatar{width:40px;height:40px;border-radius:50%;background:#f39c12;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;color:#000;flex-shrink:0;}
.d-name{font-weight:700;font-size:15px;}
.d-vehicle{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px;}
.online-btn{padding:6px 16px;border-radius:20px;border:none;
  font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
.online-btn.on{background:#27ae60;color:#fff;}
.online-btn.off{background:rgba(255,255,255,.15);color:rgba(255,255,255,.6);}

/* STATS */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);
  background:#fff;border-bottom:1px solid #eee;flex-shrink:0;}
.stat-s{text-align:center;padding:10px 4px;}
.stat-s-val{font-size:18px;font-weight:900;}
.stat-s-lbl{font-size:10px;color:#888;margin-top:1px;}

/* NAV */
.nav{display:flex;background:#fff;border-bottom:2px solid #eee;flex-shrink:0;}
.nav-tab{flex:1;padding:11px 0;text-align:center;font-size:11px;font-weight:700;
  color:#888;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;
  text-transform:uppercase;letter-spacing:.5px;}
.nav-tab.active{color:#1a1a2e;border-bottom-color:#f39c12;}

/* GPS BAR */
.gps-bar{background:#fff;padding:7px 14px;display:flex;align-items:center;
  gap:8px;font-size:12px;color:#888;border-bottom:1px solid #f0f0f0;flex-shrink:0;}
.gps-dot-el{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s;}
.acc-good{background:#27ae60;}
.acc-med{background:#f39c12;}
.acc-poor{background:#e74c3c;}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;}

/* MAP */
#map-container{position:relative;width:100%;height:220px;background:#dbeafe;flex-shrink:0;}
#gmap{width:100%;height:100%;}
.map-eta{position:absolute;top:10px;right:10px;z-index:5;
  background:#1a1a2e;color:#fff;padding:6px 13px;border-radius:18px;
  font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.map-live{position:absolute;top:10px;left:10px;z-index:5;
  background:rgba(39,174,96,.9);color:#fff;padding:4px 10px;
  border-radius:10px;font-size:11px;font-weight:700;
  display:flex;align-items:center;gap:5px;}
.live-pulse{width:7px;height:7px;border-radius:50%;background:#fff;
  animation:lpulse 1.5s infinite;}
@keyframes lpulse{0%,100%{opacity:1}50%{opacity:.3}}
.map-recenter{position:absolute;bottom:10px;right:10px;z-index:5;
  background:#fff;border:none;border-radius:50%;width:38px;height:38px;
  font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.map-no-key{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#dbeafe;
  font-size:13px;color:#3b82f6;font-weight:600;gap:6px;padding:16px;text-align:center;}

/* ORDER CARDS */
.orders-wrap{padding:12px;}
.order-card{background:#fff;border-radius:14px;margin-bottom:12px;
  overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.oc-header{padding:12px 14px;display:flex;justify-content:space-between;
  align-items:center;border-bottom:1px solid #f5f5f5;}
.oc-id{font-weight:800;font-size:15px;}
.oc-time{font-size:11px;color:#888;margin-top:2px;}
.status-chip{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;}
.chip-pickup{background:#fef3c7;color:#d97706;}
.chip-transit{background:#dbeafe;color:#2563eb;}

.oc-route{padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.route-pt{display:flex;align-items:flex-start;gap:10px;}
.rp-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;flex-shrink:0;}
.rp-rest{background:#fee2e2;}
.rp-cust{background:#d1fae5;}
.rp-lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.rp-addr{font-size:13px;font-weight:700;margin-top:1px;}
.rp-sub{font-size:11px;color:#888;}
.route-line2{height:14px;width:2px;background:#e5e7eb;margin-left:14px;}

.oc-footer{padding:10px 14px;background:#f9fafb;display:flex;
  justify-content:space-between;align-items:center;border-top:1px solid #f0f0f0;}
.oc-items{font-size:12px;color:#555;}
.oc-val{font-size:15px;font-weight:800;color:#27ae60;}

.oc-actions{padding:10px 14px;display:flex;flex-direction:column;gap:7px;}
.act-btn{padding:12px;border:none;border-radius:10px;font-size:13px;
  font-weight:700;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;}
.act-btn:active{transform:scale(.98);}
.btn-nav-rest{background:#1a1a2e;color:#fff;}
.btn-nav-cust{background:#2d3561;color:#fff;}
.btn-show-route{background:#eef0ff;color:#667eea;}
.btn-pickup{background:#f39c12;color:#fff;}
.btn-delivered{background:#27ae60;color:#fff;}
.btn-call{background:#fee2e2;color:#dc2626;}

/* EARNINGS */
.earn-wrap{padding:12px;}
.earn-hero{background:linear-gradient(135deg,#27ae60,#1e8449);
  border-radius:16px;padding:22px 20px;color:#fff;text-align:center;
  margin-bottom:12px;box-shadow:0 4px 20px rgba(39,174,96,.3);}
.earn-big{font-size:52px;font-weight:900;line-height:1;}
.earn-sub{font-size:13px;opacity:.75;margin-top:4px;}
.earn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.earn-box{background:rgba(255,255,255,.15);border-radius:10px;padding:12px;text-align:center;}
.earn-box-val{font-size:20px;font-weight:800;margin-bottom:2px;}
.earn-box-lbl{font-size:11px;opacity:.75;}
.earn-card{background:#fff;border-radius:14px;padding:18px;
  margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.earn-card-title{font-size:14px;font-weight:700;margin-bottom:14px;color:#888;
  text-transform:uppercase;letter-spacing:.5px;}
.earn-row{display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid #f5f5f5;}
.earn-row:last-child{border-bottom:none;}
.er-day{font-size:13px;font-weight:600;}
.er-val{font-size:15px;font-weight:800;color:#27ae60;}

/* HISTORY */
.hist-wrap{padding:12px;}
.hist-item{background:#fff;border-radius:12px;padding:14px;
  margin-bottom:10px;display:flex;justify-content:space-between;
  align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.hi-id{font-weight:700;font-size:14px;}
.hi-addr{font-size:12px;color:#888;margin-top:2px;}
.hi-time{font-size:11px;color:#aaa;margin-top:1px;}
.hi-earn{font-size:18px;font-weight:900;color:#27ae60;}

/* EMPTY/OFFLINE */
.center-state{text-align:center;padding:56px 20px;color:#aaa;}
.cs-icon{font-size:52px;margin-bottom:14px;}
.cs-title{font-size:17px;font-weight:800;margin-bottom:6px;color:#888;}
.cs-sub{font-size:13px;}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">

  <div class="header">
    <div class="header-row">
      <div class="driver-info">
        <div class="d-avatar" id="hdr-av">?</div>
        <div>
          <div class="d-name"   id="hdr-name">Loading…</div>
          <div class="d-vehicle" id="hdr-veh">🚗</div>
        </div>
      </div>
      <div id="user-badge" style="display:flex;align-items:center;gap:6px;"></div>
      <button class="online-btn on" id="online-btn" onclick="toggleOnline()">● Online</button>
    </div>
  </div>

  <div class="stats-strip">
    <div class="stat-s"><div class="stat-s-val" id="st-earn" style="color:#27ae60">Rs.0</div><div class="stat-s-lbl">Earnings</div></div>
    <div class="stat-s"><div class="stat-s-val" id="st-del">0</div><div class="stat-s-lbl">Delivered</div></div>
    <div class="stat-s"><div class="stat-s-val" id="st-km">—</div><div class="stat-s-lbl">Distance</div></div>
    <div class="stat-s"><div class="stat-s-val" id="st-rate" style="color:#f39c12">⭐ —</div><div class="stat-s-lbl">Rating</div></div>
  </div>

  <div class="nav">
    <div class="nav-tab active" id="tab-orders"   onclick="setTab('orders')">📦 Orders</div>
    <div class="nav-tab"        id="tab-earnings" onclick="setTab('earnings')">💷 Earnings</div>
    <div class="nav-tab"        id="tab-history"  onclick="setTab('history')">🕐 History</div>
  </div>

  <div class="gps-bar">
    <div class="gps-dot-el acc-poor" id="gps-dot"></div>
    <span id="gps-lbl">Acquiring GPS…</span>
  </div>

  <div class="content" id="content">
    <div class="center-state"><div class="cs-icon">📡</div><div class="cs-title">Getting location…</div></div>
  </div>
</div>

<div id="loading-placeholder" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;font-family:sans-serif;background:#f0f2f5;">
  <div style="font-size:40px">🚗</div>
  <div style="font-size:16px;font-weight:700">Driver Terminal</div>
  <div style="font-size:13px;color:#888">Verifying driver credentials...</div>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────
var APP = {
  session  : null,
  online   : true,
  tab      : "orders",
  orders   : [],
  history  : [],
  earn     : { today:0.00, dels:0, km:0.0 },
  avail    : [],
  fee      : 250,
  rating   : null,
  hold     : { amt: 0, n: 0 },
  rate     : 0,
  base     : 0,
  km       : {},
  kmBusy   : {},
  mapEl    : null,
  eta      : "",
  sig      : "",
  seen     : null,
  gps      : null,     
  map      : null,     
  dirR     : null,     
  driverM  : null,     
  mapReady : false,
};

var DEFAULT_REST_ADDR = "15 Galle Road, Colombo";
var DEFAULT_REST_LAT = 6.927100;
var DEFAULT_REST_LNG = 79.861200;

// ── NEW-DELIVERY ALERT (beep + vibrate + banner) ───────────────
var _audio = null;
function unlockAudio() {
  try { _audio = _audio || new (window.AudioContext || window.webkitAudioContext)(); if (_audio.state === "suspended") _audio.resume(); } catch (e) {}
}
["touchstart", "click"].forEach(function(ev){ document.addEventListener(ev, unlockAudio, { passive: true }); });
function beep() {
  try {
    unlockAudio(); if (!_audio) return;
    [0, 0.25, 0.5].forEach(function(t) {
      var o = _audio.createOscillator(), g = _audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(_audio.destination);
      g.gain.setValueAtTime(0.25, _audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, _audio.currentTime + t + 0.2);
      o.start(_audio.currentTime + t); o.stop(_audio.currentTime + t + 0.22);
    });
  } catch (e) {}
}
function alertNewDelivery(count) {
  beep();
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
  var b = document.getElementById("new-banner");
  if (!b) { b = document.createElement("div"); b.id = "new-banner";
    b.style.cssText = "position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#f39c12;color:#000;font-weight:800;padding:10px 18px;border-radius:24px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3);font-size:14px";
    document.body.appendChild(b); }
  b.textContent = "🆕 " + count + " new delivery" + (count > 1 ? " requests" : " request") + "!";
  b.style.display = "block";
  clearTimeout(b._t); b._t = setTimeout(function(){ b.style.display = "none"; }, 6000);
}

// ── DISTANCE & PAY ────────────────────────────────────────────
function haversineKm(a, b) {
  var R = 6371, toR = Math.PI / 180;
  var dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
  var x = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2 * R * Math.asin(Math.sqrt(x));
}
function payFor(km) {
  if (APP.rate > 0 && km != null) return Math.round(APP.base + APP.rate * km);
  return APP.fee;
}
// Restaurant -> customer distance: exact (road) once known, else a straight-line estimate x1.3
function legKm(o) {
  if (APP.km[o.id] != null) return { km: APP.km[o.id], approx: false };
  if (typeof o.cust.lat === "number" && typeof o.cust.lng === "number")
    return { km: haversineKm({lat:o.rest.lat,lng:o.rest.lng}, o.cust) * 1.3, approx: true };
  return null;
}
function distHtml(o) {
  var d = legKm(o);
  if (!d) return '<div class="oc-time" style="margin:6px 0 0">📏 distance calculating…</div>';
  return '<div style="margin:8px 0 0;padding:8px 10px;background:#f0fdf4;border-radius:8px;font-size:13px;font-weight:700;color:#15803d">📏 ' +
    (d.approx ? '≈ ' : '') + d.km.toFixed(1) + ' km restaurant → customer · 💰 Rs. ' + payFor(d.km) + (d.approx ? ' (est.)' : '') + '</div>';
}
// Get exact road distance (restaurant -> customer) from Google Directions; needs the map loaded
function resolveDistances() {
  if (!APP.mapReady || !window.google) return;
  APP.orders.concat(APP.avail).forEach(function(o) {
    if (APP.km[o.id] != null || APP.kmBusy[o.id]) return;
    APP.kmBusy[o.id] = true;
    var done = function() {
      if (typeof o.cust.lat !== "number") { APP.kmBusy[o.id] = false; return; }
      new google.maps.DirectionsService().route({
        origin: { lat:o.rest.lat, lng:o.rest.lng }, destination: { lat:o.cust.lat, lng:o.cust.lng },
        travelMode: google.maps.TravelMode.DRIVING
      }, function(res, st) {
        if (st === "OK") { APP.km[o.id] = res.routes[0].legs[0].distance.value / 1000; render(); }
        else { APP.kmBusy[o.id] = false; }
      });
    };
    if (typeof o.cust.lat === "number") done();
    else new google.maps.Geocoder().geocode({ address: o.cust.addr + ", Sri Lanka" }, function(r, st) {
      if (st === "OK" && r[0]) { o.cust.lat = r[0].geometry.location.lat(); o.cust.lng = r[0].geometry.location.lng(); }
      done();
    });
  });
}

// ── GPS ───────────────────────────────────────────────────────
function startGPS() {
  if (!navigator.geolocation) { setGPSBar(null, "GPS not supported"); return; }
  if (window.isSecureContext === false) { setGPSBar(null, "GPS needs https — open the online driver link"); return; }
  navigator.geolocation.watchPosition(
    function(pos) {
      APP.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
      setGPSBar(pos.coords.accuracy);
      updateDriverMarker();
      sendLocationToSheet();
    },
    function(err) { setGPSBar(null, err && err.code === 1 ? "GPS blocked — allow location in browser" : "GPS unavailable"); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 12000 }
  );
}

function setGPSBar(acc, msg) {
  var dot = document.getElementById("gps-dot");
  var lbl = document.getElementById("gps-lbl");
  if (!dot || !lbl) return;
  if (!acc) {
    dot.className = "gps-dot-el acc-poor";
    lbl.textContent = msg || "GPS unavailable";
    return;
  }
  if (acc < 20) { dot.className = "gps-dot-el acc-good"; lbl.textContent = "GPS locked · ±"+Math.round(acc)+"m"; }
  else if (acc < 60) { dot.className = "gps-dot-el acc-med";  lbl.textContent = "GPS fair · ±"+Math.round(acc)+"m"; }
  else { dot.className = "gps-dot-el acc-poor"; lbl.textContent = "GPS weak · ±"+Math.round(acc)+"m"; }
}

var _lastSend = 0;
function sendLocationToSheet() {
  if (!APP.gps || !APP.session || Date.now()-_lastSend < 30000) return;
  _lastSend = Date.now();
  var api = window.POS_GAPI; if(!api || !api.getSheetId || !api.getSheetId()) return;
  api.updateRow && api.updateRow("Drivers", 2, APP.session.email, {
    Lat: APP.gps.lat,
    Lng: APP.gps.lng,
    LastSeen: new Date().toISOString()
  }).catch(function(){});
}

// ── GOOGLE MAPS ───────────────────────────────────────────────
function hasMapsKey() {
  return typeof POS_CONFIG !== "undefined" &&
         POS_CONFIG.MAPS_API_KEY &&
         POS_CONFIG.MAPS_API_KEY !== "";
}

window.gm_authFailure = function() {
  var el = document.getElementById("map-container");
  if (el) el.innerHTML = '<div class="map-no-key"><div style="font-size:32px">🗺️</div><div>Google Maps key was rejected.<br>Use the Navigate buttons below instead.</div></div>';
  APP.mapReady = false;
};

function loadMapsAPI() {
  if (!hasMapsKey()) return;
  var s = document.createElement("script");
  s.src = "https://maps.googleapis.com/maps/api/js?key=" +
          POS_CONFIG.MAPS_API_KEY + "&libraries=geometry,places&callback=mapsReady";
  s.async = true; s.defer = true;
  document.head.appendChild(s);
}

window.mapsReady = function() {
  var el = document.getElementById("gmap");
  if (!el) return;

  var center = APP.gps ? { lat: APP.gps.lat, lng: APP.gps.lng } : { lat: DEFAULT_REST_LAT, lng: DEFAULT_REST_LNG };

  APP.mapEl = el;
  APP.map = new google.maps.Map(el, {
    zoom: 14, center: center, mapTypeId: "roadmap",
    disableDefaultUI: true, zoomControl: true, gestureHandling: "greedy",
    styles:[
      { featureType:"poi",     elementType:"labels", stylers:[{visibility:"off"}] },
      { featureType:"transit", elementType:"labels", stylers:[{visibility:"off"}] },
    ]
  });

  APP.dirR = new google.maps.DirectionsRenderer({
    map: APP.map, suppressMarkers: true,
    polylineOptions: { strokeColor:"#667eea", strokeWeight:5, strokeOpacity:.85 }
  });

  APP.mapReady = true;

  var loading = document.getElementById("map-loading");
  if (loading) loading.remove();

  if (APP.gps) placeDriverMarker();
  if (APP.orders.length) geocodeAndDrawRoute(APP.orders[0]);
  resolveDistances();
};

function placeDriverMarker() {
  if (!APP.mapReady || !APP.gps) return;
  var pos = { lat: APP.gps.lat, lng: APP.gps.lng };
  if (APP.driverM) {
    APP.driverM.setPosition(pos);
  } else {
    APP.driverM = new google.maps.Marker({
      position: pos, map: APP.map, title: "Driver Position", zIndex: 10,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 10,
              fillColor:"#4285F4", fillOpacity:1, strokeColor:"#fff", strokeWeight:3 }
    });
  }
}

function updateDriverMarker() {
  if (!APP.mapReady) return;
  placeDriverMarker();
}

function geocodeAndDrawRoute(order) {
  if (!APP.mapReady || !order) return;
  if (typeof order.cust.lat === "number" && typeof order.cust.lng === "number") { drawRoute(order); return; }
  var geocoder = new google.maps.Geocoder();
  geocoder.geocode({ address: order.cust.addr + ", Sri Lanka" }, function(results, status) {
    if (status === "OK" && results[0]) {
      order.cust.lat = results[0].geometry.location.lat();
      order.cust.lng = results[0].geometry.location.lng();
      drawRoute(order);
    } else {
      var etaEl = document.getElementById("map-eta");
      if (etaEl) etaEl.textContent = "Address not found on map — use Navigate";
    }
  });
}

var _extraMarkers = [];
function drawRoute(order) {
  if (!APP.mapReady || !order) return;

  _extraMarkers.forEach(function(m){ m.setMap(null); });
  _extraMarkers = [];

  // Plot 1: Driver Location
  var driverPos = APP.gps
    ? { lat: APP.gps.lat, lng: APP.gps.lng }
    : { lat: order.rest.lat, lng: order.rest.lng };

  // Plot 2: Restaurant Location
  var restPos = { lat: order.rest.lat, lng: order.rest.lng };

  // Plot 3: Customer Location
  var custPos = { lat: order.cust.lat, lng: order.cust.lng };

  var origin      = driverPos;
  var destination = custPos;
  var waypoints   = [];

  if (order.status === "pickup") {
    waypoints = [{ location: restPos, stopover:true }];
  }

  new google.maps.DirectionsService().route({
    origin: origin,
    destination: destination,
    waypoints: waypoints,
    travelMode: google.maps.TravelMode.DRIVING,
  }, function(result, status) {
    if (status !== "OK") { console.warn("Directions API error:", status); return; }
    APP.dirR.setDirections(result);

    var leg   = result.routes[0].legs[0];
    var totalDur = result.routes[0].legs.reduce(function(sm,l){ return sm + l.duration.value; }, 0);
    var totalKm0 = result.routes[0].legs.reduce(function(sm,l){ return sm + l.distance.value; }, 0) / 1000;
    APP.eta = "Route " + totalKm0.toFixed(1) + " km · ETA " + Math.max(1, Math.round(totalDur/60)) + " min";
    var etaEl = document.getElementById("map-eta");
    if (etaEl) etaEl.textContent = APP.eta;

    var totalM = result.routes[0].legs.reduce(function(s,l){ return s+l.distance.value; }, 0);
    APP.earn.km = (totalM/1000).toFixed(1);
    var kmEl = document.getElementById("st-km");
    if (kmEl) kmEl.textContent = APP.earn.km + " km";

    // Restaurant pin (Red marker with 'R')
    _extraMarkers.push(new google.maps.Marker({
      position: restPos,
      map: APP.map, title: order.rest.name, zIndex:5,
      icon: {
        path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z",
        fillColor:"#e74c3c", fillOpacity:1, strokeColor:"#fff", strokeWeight:1,
        scale:1.6, anchor: new google.maps.Point(12,22)
      },
      label:{ text:"R", color:"#fff", fontSize:"11px", fontWeight:"bold" }
    }));

    // Customer pin (Green marker with 'C')
    _extraMarkers.push(new google.maps.Marker({
      position: custPos,
      map: APP.map, title: order.cust.name, zIndex:5,
      icon: {
        path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z",
        fillColor:"#27ae60", fillOpacity:1, strokeColor:"#fff", strokeWeight:1,
        scale:1.6, anchor: new google.maps.Point(12,22)
      },
      label:{ text:"C", color:"#fff", fontSize:"11px", fontWeight:"bold" }
    }));
  });
}

function recenterMap() {
  if (!APP.map || !APP.gps) return;
  APP.map.panTo({ lat: APP.gps.lat, lng: APP.gps.lng });
  APP.map.setZoom(15);
}

function openGoogleMaps(addr) {
  var url = "https://www.google.com/maps/dir/?api=1&destination=" +
            encodeURIComponent(addr) + "&travelmode=driving";
  window.open(url, "_blank");
}

// Navigate using exact coordinates when we have them (pinned location),
// otherwise the readable address. 'who' = "rest" | "cust".
function navTo(id, who) {
  var o = APP.orders.concat(APP.avail).find(function(x){ return x.id === id; });
  if (!o) return;
  var t = who === "rest" ? o.rest : o.cust;
  openGoogleMaps(typeof t.lat === "number" && typeof t.lng === "number" ? t.lat + "," + t.lng : t.addr);
}

function callCust(id) {
  var o = APP.orders.concat(APP.avail).find(function(x){ return x.id === id; });
  if (o && o.cust.phone) window.location.href = "tel:" + o.cust.phone;
}

function showRouteOnMap(id) {
  var order = APP.orders.find(function(o){ return o.id===id; });
  if (order && APP.mapReady) {
    geocodeAndDrawRoute(order);
    document.getElementById("content").scrollTop = 0;
  }
}

// ── TABS ──────────────────────────────────────────────────────
function setTab(tab) {
  APP.tab = tab;
  ["orders","earnings","history"].forEach(function(t){
    var el = document.getElementById("tab-"+t);
    if (el) el.classList.toggle("active", t===tab);
  });
  render();
  if (tab === "orders" && APP.mapReady && APP.orders.length) {
    setTimeout(function(){ geocodeAndDrawRoute(APP.orders[0]); }, 100);
  }
}

function toggleOnline() {
  APP.online = !APP.online;
  var btn = document.getElementById("online-btn");
  if (btn) {
    btn.className   = "online-btn " + (APP.online ? "on" : "off");
    btn.textContent = APP.online ? "● Online" : "○ Offline";
  }
  render();
}

// ── RENDER ────────────────────────────────────────────────────
function render() {
  var el = document.getElementById("content");
  if (!el) return;
  if (APP.tab === "orders") {
    el.innerHTML = renderOrders();
    // renderOrders() makes a fresh #gmap div each time; put the live map back so it never goes blank
    var ph = document.getElementById("gmap");
    if (ph && APP.mapEl && ph !== APP.mapEl) {
      ph.parentNode.replaceChild(APP.mapEl, ph);
      if (window.google && APP.map) google.maps.event.trigger(APP.map, "resize");
    }
    var etaEl = document.getElementById("map-eta");
    if (etaEl && APP.eta) etaEl.textContent = APP.eta;
    return;
  }
  if (APP.tab === "earnings") { el.innerHTML = renderEarnings(); return; }
  if (APP.tab === "history")  { el.innerHTML = renderHistory();  return; }
}

async function loadLiveDeliveries() {
  var api = window.POS_GAPI || window.POS_API;
  if (!api || !api.getSheetId || !api.getSheetId()) return;

  try {
    // 1. Fetch live Deliveries, Orders, and Settings from Sheets
    const [delRows, ordRows, setRows] = await Promise.all([
      api.getRows("Deliveries"),
      api.getRows("Orders"),
      api.getRows("Settings")
    ]);

    // 2. Resolve dynamic Restaurant address and GPS coordinates
    var restName = POS_CONFIG.RESTAURANT_NAME;
    var restAddr = DEFAULT_REST_ADDR;
    var restLat  = DEFAULT_REST_LAT;
    var restLng  = DEFAULT_REST_LNG;

    var setRestName = setRows.find(s => s.Key === "restaurant_name");
    var setRestAddr = setRows.find(s => s.Key === "restaurant_address");
    var setRestLat  = setRows.find(s => s.Key === "restaurant_lat");
    var setRestLng  = setRows.find(s => s.Key === "restaurant_lng");

    if (setRestName) restName = setRestName.Value;
    if (setRestAddr) restAddr = setRestAddr.Value;
    if (setRestLat && parseFloat(setRestLat.Value)) restLat = parseFloat(setRestLat.Value);
    if (setRestLng && parseFloat(setRestLng.Value)) restLng = parseFloat(setRestLng.Value);

    var feeRow = setRows.find(s => s.Key === "driver_fee") || setRows.find(s => s.Key === "delivery_fee");
    if (feeRow && parseFloat(feeRow.Value) >= 0) APP.fee = parseFloat(feeRow.Value);
    var rateRow = setRows.find(s => s.Key === "driver_rate_per_km"), baseRow = setRows.find(s => s.Key === "driver_base_fee");
    APP.rate = rateRow ? (parseFloat(rateRow.Value) || 0) : 0;
    APP.base = baseRow ? (parseFloat(baseRow.Value) || 0) : 0;

    // 3. Deliveries assigned to this driver, plus unassigned ones anyone can accept
    const driverEmail = APP.session.email.toLowerCase();
    const mine = function(d) { return d.DriverEmail && d.DriverEmail.toLowerCase() === driverEmail; };
    const activeDels = delRows.filter(function(d) { return mine(d) && d.Status !== "delivered" && d.Status !== "cancelled"; });
    const historicalDels = delRows.filter(function(d) { return mine(d) && d.Status === "delivered"; });
    const openDels = delRows.filter(function(d) { return !d.DriverEmail && (!d.Status || d.Status === "pending"); });

    // 4. Earnings / history
    APP.earn.dels = historicalDels.length;
    APP.earn.today = historicalDels.reduce((sum, d) => sum + (parseFloat(d.Earnings) || 0), 0);
    var earnEl = document.getElementById("st-earn");
    var delEl = document.getElementById("st-del");
    if (earnEl) earnEl.textContent = "Rs. " + APP.earn.today.toFixed(0);
    if (delEl) delEl.textContent = APP.earn.dels;
    // Cash the driver is holding: delivered orders the till hasn't received yet
    var holding = 0, holdingN = 0;
    APP.history = historicalDels.map(function(d) {
      var ord = ordRows.find(function(x){ return x.OrderID === d.OrderID; }) || {};
      var st = String(ord.Status || "").toLowerCase();
      var settled = st === "closed" || st === "paid" || /PAID/i.test(String(ord.Notes || ""));
      var amt = parseFloat(ord.Total) || 0;
      if (!settled && st !== "cancelled") { holding += amt; holdingN++; }
      return { id: d.OrderID || d.DeliveryID, addr: d.CustomerAddress || "", amt: amt, settled: settled,
               time: d.DeliveredTime ? new Date(d.DeliveredTime).toLocaleTimeString("en-GB", {hour:"2-digit",minute:"2-digit"}) : "Complete",
               earn: parseFloat(d.Earnings) || APP.fee };
    });
    APP.hold = { amt: holding, n: holdingN };

    // 5. Join each delivery with its order (items, phone, readable address, pin)
    function build(d) {
      const o = ordRows.find(function(x) { return x.OrderID === d.OrderID; }) || {};
      let items = ["Food Package"];
      try { items = JSON.parse(o.Items).filter(function(it){ return !it.isDeal; }).map(function(it){ return (it.qty || it.quantity) + "x " + (it.name || it.Name); }); } catch(e) {}
      if (!items.length) items = ["Food Package"];
      const addrRaw = d.CustomerAddress || o.CustomerAddress || "";
      const view = { CustomerAddress: addrRaw, Notes: o.Notes || "", CustomerPhone: o.CustomerPhone || "" };
      let lat, lng;
      const g = String(addrRaw).match(/GPS:\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)/i) ||
                String(o.Notes || "").match(/[?&]q=(-?[\d.]+),(-?[\d.]+)/);
      if (g) { lat = parseFloat(g[1]); lng = parseFloat(g[2]); }
      const readable = (window.POS_ORDER ? POS_ORDER.address(view) : addrRaw) || "Address not given";
      const cust = { name: d.CustomerName || o.CustomerName || "Customer",
                     addr: readable,
                     phone: window.POS_ORDER ? POS_ORDER.phone(view) : String(o.CustomerPhone || "") };
      if (!isNaN(lat) && lat !== undefined) { cust.lat = lat; cust.lng = lng; }
      return {
        id: d.OrderID, deliveryId: d.DeliveryID,
        time: d.PickupTime ? new Date(d.PickupTime).toLocaleTimeString("en-GB", {hour:"2-digit",minute:"2-digit"}) : (o.OrderTime ? new Date(o.OrderTime).toLocaleTimeString("en-GB", {hour:"2-digit",minute:"2-digit"}) : "Just now"),
        status: d.Status === "pending" || d.Status === "pickup" || !d.Status ? "pickup" : "transit",
        rest: { name: restName, addr: restAddr, lat: restLat, lng: restLng },
        cust: cust, items: items, val: parseFloat(o.Total) || 0
      };
    }
    var newOrders = activeDels.map(build), newAvail = openDels.map(build);
    var sig = JSON.stringify([newOrders, newAvail, APP.rate, APP.base, APP.fee, APP.history.length, APP.hold, APP.history.map(function(h){ return h.settled; })]);
    var changed = sig !== APP.sig;
    APP.sig = sig;
    if (changed) { APP.orders = newOrders; APP.avail = newAvail; }
    // alert when a delivery we haven't seen before shows up (not for the first load)
    var ids = newAvail.map(function(o){ return o.deliveryId; });
    if (APP.seen === null) APP.seen = {};
    else {
      var fresh = ids.filter(function(id){ return !APP.seen[id]; });
      if (fresh.length && APP.online) alertNewDelivery(fresh.length);
    }
    ids.forEach(function(id){ APP.seen[id] = true; });

    if (changed) {
      render();
      if (APP.orders.length && APP.mapReady) geocodeAndDrawRoute(APP.orders[0]);
      resolveDistances();
    }
  } catch(e) {
    console.error("Live deliveries joining error:", e);
  }
}

async function claimDelivery(deliveryId) {
  var api = window.POS_GAPI || window.POS_API;
  try {
    // re-read first: someone else may have accepted it a moment ago
    var rows = await api.getRows("Deliveries");
    var d = rows.find(function(r){ return r.DeliveryID === deliveryId; });
    if (!d || d.DriverEmail) { alert("Sorry, another driver already took this delivery."); await loadLiveDeliveries(); return; }
    await api.updateRow("Deliveries", 0, deliveryId, { DriverEmail: APP.session.email, Status: "pickup" });
    await loadLiveDeliveries();
  } catch (e) { alert("Could not accept delivery: " + e.message); }
}

async function updateStatus(deliveryId, status) {
  var api = window.POS_GAPI || window.POS_API;
  if (!api || !api.getSheetId()) return;

  try {
    if (status === "delivered") {
      var matchDel = APP.orders.find(function(o){ return o.deliveryId === deliveryId; });
      var dk = matchDel ? legKm(matchDel) : null;
      // 1. Mark delivery row as delivered in Sheets (pay = base + rate x km, or the flat fee)
      await api.updateRow("Deliveries", 0, deliveryId, {
         Status: "delivered",
         DeliveredTime: new Date().toISOString(),
         Distance: dk ? dk.km.toFixed(1) : "",
         Earnings: String(payFor(dk ? dk.km : null))
      });

      // 2. Close the main order row
      if (matchDel && matchDel.id) {
          await api.updateRow("Orders", 0, matchDel.id, {
             Status: "delivered"
          });
      }

      showNotification("Delivery complete! Payout recorded.");

    } else {
      // Mark as picked up (In Transit)
      await api.updateRow("Deliveries", 0, deliveryId, {
         Status: status,
         PickupTime: new Date().toISOString()
      });
      showNotification("Pickup confirmed. Start driving!");
    }
    
    await loadLiveDeliveries();
  } catch(err) {
      console.error("Failed to update status on sheet:", err);
  }
}

function showNotification(msg) {
    console.log("Driver notification:", msg);
}

</script>
<script>
(function() {
  function startAuth() {
    if (typeof POS_AUTH === "undefined") {
      console.error("POS_AUTH failed to load");
      return;
    }
    POS_AUTH.init("driver-app", {
      onReady: function(session) {
        APP.session = session;

        var root = document.getElementById("app");
        if (root) root.style.display = "flex";
        var loader = document.getElementById("loading-placeholder");
        if (loader) loader.style.display = "none";

        var name = (session && session.name) ? session.name : "Driver";
        var veh  = (session && session.driverData && session.driverData.Vehicle) ? session.driverData.Vehicle : "Vehicle";
        var plt  = (session && session.driverData && session.driverData.PlateNumber) ? session.driverData.PlateNumber : "";
        
        var avatarEl = document.getElementById("hdr-av");
        var nameEl = document.getElementById("hdr-name");
        var vehEl = document.getElementById("hdr-veh");
        if (avatarEl) avatarEl.textContent = name.charAt(0).toUpperCase();
        if (nameEl) nameEl.textContent = name;
        if (vehEl) vehEl.textContent = "🚗 " + veh + (plt ? " · " + plt : "");

        var rt = session && session.driverData && parseFloat(session.driverData.Rating);
        var rEl = document.getElementById("st-rate");
        if (rEl && rt) rEl.textContent = "⭐ " + rt.toFixed(1);
        startGPS();
        loadMapsAPI();
        loadLiveDeliveries();
        setInterval(loadLiveDeliveries, 8000);
        render();

        setTimeout(function() {
          if (typeof POS_AUTH.renderUtilBar === "function") {
            POS_AUTH.renderUtilBar("user-badge", "driver-app");
          }
        }, 500);
      },
      onError: function(msg) { console.error("Auth error:", msg); }
    });
  }

  if (typeof POS_AUTH !== "undefined") {
    startAuth();
  } else {
    var tries = 0;
    var iv = setInterval(function() {
      tries++;
      if (typeof POS_AUTH !== "undefined") { clearInterval(iv); startAuth(); }
      else if (tries > 50) { clearInterval(iv); startAuth(); }
    }, 100);
  }
})();
</script>
