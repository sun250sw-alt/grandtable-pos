    function RotaManager() {
      const today  = new Date();
      const monday = new Date(today);
      monday.setDate(today.getDate() - ((today.getDay()+6)%7));

      const [weekOffset, setWeekOffset] = useState(0);
      const [rota, setRota]             = useState({});
      const [showModal, setShowModal]   = useState(false);
      const [editCell, setEditCell]     = useState(null);
      const [form, setForm]             = useState({ start:"09:00", end:"17:00", role:"Waiter", notes:"" });
      const [staffNames, setStaffNames] = useState([]);

      const loadRotaAndStaff = async () => {
        if (!window.POS_GAPI || !window.POS_GAPI.getSheetId()) return;
        try {
          const staffRes = await window.POS_GAPI.Staff.getAll();
          if (staffRes && staffRes.data) {
              const activeNames = staffRes.data
                .filter(s => s !== null && s !== undefined && s.Name && s.Status === "active")
                .map(s => s.Name);
              setStaffNames(activeNames);
          }

          const rotaRes = await window.POS_GAPI.getRows("Rota");
          if (rotaRes) {
              const map = {};
              rotaRes.filter(r => r !== null && r !== undefined).forEach(r => {
                const key = r.StaffName + "|" + r.Date;
                map[key] = {
                  id: r.RotaID,
                  start: r.ShiftStart,
                  end: r.ShiftEnd,
                  role: r.Role,
                  notes: r.Notes || "",
                  status: r.Status || "confirmed"
                };
              });
              setRota(map);
          }
        } catch(e) { console.error("Rota load error:", e); }
      };

      useEffect(() => {
        loadRotaAndStaff();
        const pollMs = (window.POS_CONFIG && window.POS_CONFIG.POLL_MS) || 5000;
        const iv = setInterval(loadRotaAndStaff, pollMs);
        return () => clearInterval(iv);
      }, []);

      function getWeekDates() {
        return DAYS.map((_,i) => {
          const d = new Date(monday);
          d.setDate(monday.getDate() + weekOffset*7 + i);
          return d;
        });
      }

      const weekDates = getWeekDates();
      const weekLabel = `${weekDates[0] && !isNaN(weekDates[0].getTime()) ? weekDates[0].toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : ""} – ${weekDates[6] && !isNaN(weekDates[6].getTime()) ? weekDates[6].toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : ""}`;

      function cellKey(staff, date) {
        const parsedDateStr = (date && !isNaN(date.getTime())) ? date.toISOString().split("T")[0] : "undefined";
        return staff + "|" + parsedDateStr;
      }

      function openCell(staff, date) {
        const key      = cellKey(staff, date);
        const existing = rota[key];
        setEditCell({ staff, date, key });
        setForm(existing || { start:"09:00", end:"17:00", role:"Waiter", notes:"" });
        setShowModal(true);
      }

      const saveShift = async () => {
        if (!editCell) return;
        const existing = rota[editCell.key];
        try {
            if (window.POS_GAPI && window.POS_GAPI.getSheetId()) {
                const dateStr = editCell.date.toISOString().split("T")[0];
                if (existing && existing.id) {
                    await window.POS_GAPI.updateRow("Rota", 0, existing.id, {
                        ShiftStart: form.start,
                        ShiftEnd: form.end,
                        Role: form.role,
                        Notes: form.notes
                    });
                } else {
                    const id = window.POS_GAPI.uid("ROT");
                    await window.POS_GAPI.appendRow("Rota", [
                        id, "", editCell.staff, dateStr, form.start, form.end, form.role, "", form.notes, "confirmed"
                    ]);
                }
                await loadRotaAndStaff();
                setShowModal(false);
            }
        } catch(e) { alert("Failed to save shift: " + e.message); }
      };

      const clearShift = async () => {
        if (!editCell || !rota[editCell.key]) return;
        const existing = rota[editCell.key];
        try {
            if (window.POS_GAPI && window.POS_GAPI.getSheetId() && existing.id) {
                await window.POS_GAPI.deleteRow("Rota", 0, existing.id);
                await loadRotaAndStaff();
                setShowModal(false);
            }
        } catch(e) { alert("Failed to clear shift: " + e.message); }
      };

      function calcH(start, end) {
        if (!start || !end || !start.includes(":") || !end.includes(":")) return 0;
        const [sh,sm] = start.split(":").map(Number);
        const [eh,em] = end.split(":").map(Number);
        return +((eh*60+em-sh*60-sm)/60).toFixed(1);
      }

      const todayStr = new Date().toISOString().split("T")[0];
      const activeStaffRender = staffNames.length > 0 ? staffNames : ROTA_STAFF;

      return (
        <>
          <div className="table-card" style={{ marginBottom:"16px" }}>
            <div className="table-card-header">
              <div style={{ display:"flex", alignItems:"center", gap:"12px" }}>
                <button className="btn btn-ghost" style={{padding:"6px 14px"}} onClick={()=>setWeekOffset(w=>w-1)}>‹ Prev</button>
                <div className="table-card-title">📅 {weekLabel}</div>
                <button className="btn btn-ghost" style={{padding:"6px 14px"}} onClick={()=>setWeekOffset(w=>w+1)}>Next ›</button>
              </div>
              <div style={{ display:"flex", gap:"8px" }}>
                <button className="btn btn-ghost" onClick={()=>setWeekOffset(0)}>This Week</button>

    function SettingsPage({ toast }) {
        const [form, setForm] = useState({ name: "", currency: "LKR", tax: "10", delivery: "250", pin: "1234", address: "", lat: "", lng: "", rate: "", base: "", offerKind: "offer", offerTitle: "", offerText: "", offerUntil: "", offerActive: true, openTime: "", closeTime: "", deliveryOn: true });
        const [saving, setSaving] = useState(false);
        const [showMap, setShowMap] = useState(false);
        const [mapMsg, setMapMsg] = useState("");
        const [pasteTxt, setPasteTxt] = useState("");

        const handleDetectLocation = () => {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }
            toast("📍 Querying GPS coordinates...");
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    setForm(prev => ({
                        ...prev,
                        lat: pos.coords.latitude.toFixed(6),
                        lng: pos.coords.longitude.toFixed(6)
                    }));
                    toast("✅ Shop coordinates locked successfully!");
                },

                    alert("GPS Access Denied. Please input coordinates manually.");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        };

        // Accepts "6.9271, 79.8612", a Google Maps link with @lat,lng or ?q=lat,lng
        const parseLatLng = (t) => {
            t = String(t || ""); try { t = decodeURIComponent(t); } catch (e) {}
            const m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+)[,+ ]\s*(-?\d+\.\d+)/) ||
                      t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || t.match(/^\s*(-?\d+\.\d+)\s*[, ]\s*(-?\d+\.\d+)\s*$/);
            return m ? { lat: parseFloat(m[1]), lng: parseFloat(m[2]) } : null;
        };
        const applyPaste = () => {
            const ll = parseLatLng(pasteTxt);
            if (!ll) { alert("Could not find coordinates in that text. Paste the full Google Maps link (not the short maps.app.goo.gl one) or 'lat, lng'."); return; }
            setForm(f => ({ ...f, lat: ll.lat.toFixed(6), lng: ll.lng.toFixed(6) }));
            setPasteTxt(""); toast("✅ Location set from link");
        };
        const setPoint = (lat, lng, fillAddress) => {
            setForm(f => ({ ...f, lat: lat.toFixed(6), lng: lng.toFixed(6) }));
            if (fillAddress && window.google && !formRef.current.address) {
                new google.maps.Geocoder().geocode({ location: { lat, lng } }, (r, st) => {
                    if (st === "OK" && r[0]) setForm(f => f.address ? f : { ...f, address: r[0].formatted_address });
                });
            }
        };
        useEffect(() => {
            if (!showMap) return;
            let cancelled = false;
            const init = () => {
                if (cancelled || !mapDiv.current || !window.google || !google.maps) return;
                const f = formRef.current;
                const has = parseFloat(f.lat) && parseFloat(f.lng);
                const c = has ? { lat: parseFloat(f.lat), lng: parseFloat(f.lng) } : { lat: 6.9271, lng: 79.8612 };
                const map = new google.maps.Map(mapDiv.current, { center: c, zoom: has ? 17 : 12, streetViewControl: false, mapTypeControl: true });
                const marker = new google.maps.Marker({ position: c, map, draggable: true, visible: !!has, title: "Restaurant" });
                map.addListener("click", e => { marker.setPosition(e.latLng); marker.setVisible(true); setPoint(e.latLng.lat(), e.latLng.lng(), true); });
                marker.addListener("dragend", e => setPoint(e.latLng.lat(), e.latLng.lng(), true));
                mapObj.current = map; markerObj.current = marker; setMapMsg("");
            };
            if (window.google && google.maps) { init(); }
            else {
                const key = (typeof POS_CONFIG !== "undefined" && POS_CONFIG.MAPS_API_KEY) || "";
                if (!key) { setMapMsg("No Google Maps key in pos-config.js. Use the paste-link box instead."); return; }
                window.gm_authFailure = () => setMapMsg("Google rejected the Maps key (check Maps JavaScript API + billing). Use the paste-link box instead.");
                window.__mpMapsReady = init;
                const sc = document.createElement("script");
                sc.src = "https://maps.googleapis.com/maps/api/js?key=" + key + "&callback=__mpMapsReady";
                sc.onerror = () => setMapMsg("Map could not load (no internet?). Use the paste-link box instead.");
                document.head.appendChild(sc);
                setMapMsg("Loading map…");
            }
            return () => { cancelled = true; };
        }, [showMap]);
        const searchPlace = () => {
            const q = (document.getElementById("mp-search") || {}).value;
            if (!q || !window.google || !mapObj.current) return;
            new google.maps.Geocoder().geocode({ address: q }, (r, st) => {
                if (st !== "OK" || !r[0]) { alert("Place not found"); return; }
                const l = r[0].geometry.location;
                mapObj.current.setCenter(l); mapObj.current.setZoom(17);
                markerObj.current.setPosition(l); markerObj.current.setVisible(true);
                setPoint(l.lat(), l.lng(), true);
            });
        };

        const handleSave = async () => {
            if (!form.name || !form.pin) { alert("Restaurant Name and PIN are required"); return; }
            if (form.pin.replace(/\D/g, "").length !== 4) { alert("PIN must be exactly 4 digits"); return; }
            
            setSaving(true);
            try {
                if (window.POS_GAPI && window.POS_GAPI.getSheetId()) {
                    await window.POS_GAPI.Settings.update({
                        restaurant_name: form.name,
                        currency: form.currency,

                        offer_text: form.offerText.trim(),
                        offer_until: form.offerUntil,

                        open_time: form.openTime,
                        close_time: form.closeTime,
                        delivery_enabled: form.deliveryOn ? "true" : "false"
                    });
                    toast("⚙️ Settings updated successfully!");
                }
            } catch(e) { alert("Failed to save settings: " + e.message); }
            setSaving(false);
        };

        return (
            <div className="table-card" style={{ padding: "28px" }}>
                <div className="table-card-header" style={{ borderBottom: "1px solid #f0f0f0", paddingBottom: "14px", marginBottom: "20px" }}>
                    <div className="table-card-title">⚙️ Restaurant Preferences</div>
                </div>
                <div className="form-grid settings-grid" style={{ maxWidth: "600px" }}>

                        <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="e.g. The Grand Table" />

                    </div>
                    <div className="form-group" style={{ gridColumn: "1/-1", display: "flex", gap: "10px", alignItems: "flex-end" }}>
                        <div style={{ flex: 1 }}>
                            <label>GPS Coordinates (Latitude, Longitude)</label>
                            <div style={{ display: "flex", gap: "8px" }}>
                                <input value={form.lat} onChange={e => setForm({ ...form, lat: e.target.value })} placeholder="e.g. 6.927100" />
                                <input value={form.lng} onChange={e => setForm({ ...form, lng: e.target.value })} placeholder="e.g. 79.861200" />
                            </div>
                        </div>
                        <button className="btn btn-ghost" type="button" onClick={handleDetectLocation} style={{ height: "42px" }}>
                            📌 Detect GPS Location

                    <div className="form-group" style={{ gridColumn: "1/-1" }}>

                            <input value={pasteTxt} onChange={e => setPasteTxt(e.target.value)} placeholder="…or paste a Google Maps link / 'lat, lng'" style={{ flex: 1, minWidth: "200px" }} />
                            <button className="btn btn-ghost" type="button" onClick={applyPaste}>Use</button>

        const load = async () => {
            try {
                const s = window.POS_GAPI.getSettings(); if (s && s.currency) setCurrency(s.currency + " ");
                setMenu((await window.POS_GAPI.getRows("MenuItems")).filter(Boolean));
                setRows((await window.POS_GAPI.getRows("Deals")).filter(Boolean)); D.load(true);
            } catch (e) { setRows([]); alert("Could not load deals: " + e.message + "\n(Google Sheets mode: add a tab named Deals with the columns DealID, Name, Type, Items, Category, BuyQty, Price, Value, Days, StartTime, EndTime, StartDate, EndDate, Active, Description.)"); }
        };
        useEffect(() => { load(); }, []);
        if (!rows) return <div style={{ padding: 20, textAlign: "center", color: "#888" }}>Loading deals...</div>;
        const money = (n) => currency + (Math.round((parseFloat(n) || 0) * 100) / 100).toLocaleString();
        const cats = [...new Set(menu.map(m => m.Category).filter(Boolean))];
        const priceOf = (n) => { const m = menu.find(x => String(x.Name).toLowerCase() === String(n).toLowerCase()); return m ? parseFloat(m.Price) || 0 : 0; };
        const typeName = { combo: "🍔 Combo (fixed price)", multi: "🔢 Any N for a price", percent: "％ Percent off", amount: "💵 Amount off each" };
        const edit = (r) => { let items = D.names(r); if (!items.length) items = [{ name: "", qty: 1 }]; setForm({ ...blank, ...r, Items: items, Days: String(r.Days || "").split(",").map(x => x.trim()).filter(Boolean), scope: r.Category ? "category" : "items", Active: !["false", "0"].includes(String(r.Active).toLowerCase()) ? 1 : 0 }); };
        const preview = (f) => {   // what the customer saves, from the regular prices
            const list = f.Items.filter(i => i.name);
            if (f.Type === "combo") { const reg = list.reduce((a, i) => a + priceOf(i.name) * (parseInt(i.qty, 10) || 1), 0); return reg > 0 && f.Price !== "" ? { reg, save: reg - parseFloat(f.Price) } : null; }
            if (f.Type === "multi") { const el = f.scope === "category" ? menu.filter(m => m.Category === f.Category) : list.map(i => ({ Price: priceOf(i.name) })); const avg = el.length ? el.reduce((a, m) => a + (parseFloat(m.Price) || 0), 0) / el.length : 0; const reg = avg * (parseInt(f.BuyQty, 10) || 0); return reg > 0 && f.Price !== "" ? { reg, save: reg - parseFloat(f.Price), approx: el.length > 1 } : null; }
            return null;
        };
        const save = async () => {
            const f = form; if (!f.Name.trim()) return alert("Give the deal a name.");
            const items = f.Items.filter(i => i.name).map(i => ({ name: i.name, qty: parseInt(i.qty, 10) || 1 }));
            if (f.Type === "combo" && items.length < 1) return alert("Add the items in the combo.");
            if ((f.Type === "combo" || f.Type === "multi") && !(parseFloat(f.Price) >= 0) ) return alert("Enter the deal price.");
            if (f.Type === "multi" && (parseInt(f.BuyQty, 10) || 0) < 2) return alert("'Any N' needs at least 2 items.");
            if (f.Type === "multi" && f.scope === "items" && !items.length) return alert("Pick the items (or switch to a category).");
            if ((f.Type === "percent" || f.Type === "amount") && !(parseFloat(f.Value) > 0)) return alert("Enter the " + (f.Type === "percent" ? "percentage" : "amount") + " off.");
            setSaving(true);
            try {
                const useCat = f.Type !== "combo" && f.scope === "category";
                const r = { Name: f.Name.trim(), Type: f.Type, Items: f.Type !== "combo" && useCat ? "[]" : JSON.stringify(items), Category: useCat ? f.Category : "", BuyQty: f.Type === "multi" ? parseInt(f.BuyQty, 10) : "", Price: f.Type === "combo" || f.Type === "multi" ? parseFloat(f.Price) : "", Value: f.Type === "percent" || f.Type === "amount" ? parseFloat(f.Value) : "", Days: f.Days.join(","), StartTime: f.StartTime, EndTime: f.EndTime, StartDate: f.StartDate, EndDate: f.EndDate, Active: f.Active ? 1 : 0, Description: f.Description };
                if (f.DealID) await window.POS_GAPI.updateRow("Deals", 0, f.DealID, r);
                else await window.POS_GAPI.appendRow("Deals", [window.POS_GAPI.uid("DEAL"), r.Name, r.Type, r.Items, r.Category, r.BuyQty, r.Price, r.Value, r.Days, r.StartTime, r.EndTime, r.StartDate, r.EndDate, r.Active, r.Description]);
                await load(); setForm(null);
            } catch (e) { alert("Could not save: " + e.message); }
            setSaving(false);
        };
        const toggle = async (r) => { const on = ["false", "0"].includes(String(r.Active).toLowerCase()); try { await window.POS_GAPI.updateRow("Deals", 0, r.DealID, { Active: on ? 1 : 0 }); await load(); } catch (e) { alert(e.message); } };
        const del = async (r) => { if (!confirm("Delete the deal \"" + r.Name + "\"?")) return; try { await window.POS_GAPI.deleteRow("Deals", 0, r.DealID); await load(); } catch (e) { alert(e.message); } };
        const inp = { padding: 10, borderRadius: 8, border: "2px solid #e8e8e8", width: "100%" };
        const sched = (r) => [String(r.Days || "") || "every day", r.StartTime && r.EndTime ? r.StartTime + "–" + r.EndTime : "", r.StartDate || r.EndDate ? (r.StartDate || "…") + " → " + (r.EndDate || "…") : ""].filter(Boolean).join(" · ");
        const pv = form ? preview(form) : null;
        const itemRows = form && form.Items.map((it, i) => (
            <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 70px auto", gap: 6, marginBottom: 6 }}>
                <select style={inp} value={it.name} onChange={e => setForm({ ...form, Items: form.Items.map((x, j) => j === i ? { ...x, name: e.target.value } : x) })}><option value="">— choose item —</option>{menu.map(m => <option key={m.ItemID} value={m.Name}>{m.Name} ({money(m.Price)})</option>)}</select>
                {form.Type === "combo" ? <input style={inp} type="number" min="1" value={it.qty} onChange={e => setForm({ ...form, Items: form.Items.map((x, j) => j === i ? { ...x, qty: e.target.value } : x) })} /> : <span></span>}
                <button className="remove-btn" onClick={() => setForm({ ...form, Items: form.Items.filter((_, j) => j !== i) })}>✕</button>
            </div>));
        return (
            <>
                <div style={{ fontSize: 13, color: "#666", marginBottom: 12 }}>Deals are applied automatically on the till, waiter app and customer app — the saving shows on the bill. If several deals fit, the one that saves the customer most is used first.</div>
                <div className="table-card">
                    <div className="table-card-header"><div className="table-card-title">Deals &amp; special offers</div><button className="btn btn-success" onClick={() => setForm({ ...blank })}>+ New deal</button></div>
                    <div style={{ overflowX: "auto" }}><table className="data-table">
                        <thead><tr><th>Deal</th><th>What it does</th><th>When</th><th>Active</th><th>Actions</th></tr></thead>
                        <tbody>
                            {rows.length === 0 && <tr><td colSpan="5" style={{ textAlign: "center", color: "#999", padding: 24 }}>No deals yet — build a combo, "any 3 for…" or a happy-hour discount.</td></tr>}
                            {rows.map(r => { const on = !["false", "0"].includes(String(r.Active).toLowerCase()); return <tr key={r.DealID}>
                                <td><strong>{r.Name}</strong><div style={{ fontSize: 11, color: "#999" }}>{typeName[r.Type] || r.Type}</div></td>
                                <td style={{ maxWidth: 300 }}>{D.describe(r).replace(/ = (\d)/, " = " + currency + "$1")}</td>
                                <td style={{ fontSize: 12 }}>{sched(r)}</td>
                                <td><span onClick={() => toggle(r)} style={{ cursor: "pointer", display: "inline-block", width: 42, height: 24, borderRadius: 12, background: on ? "#27ae60" : "#c0c0c0", position: "relative" }}><span style={{ position: "absolute", top: 3, left: on ? 21 : 3, width: 18, height: 18, borderRadius: "50%", background: "#fff", transition: "all .2s" }}></span></span></td>
                                <td><div style={{ display: "flex", gap: 6 }}><button className="btn btn-primary" style={{ padding: "5px 11px", fontSize: 12 }} onClick={() => edit(r)}>📝 Edit</button><button className="btn btn-danger" style={{ padding: "5px 11px", fontSize: 12 }} onClick={() => del(r)}>🗑️</button></div></td>
                            </tr>; })}
                        </tbody>
                    </table></div>
                </div>
                {form && (
                    <div className="modal-overlay"><div className="modal" style={{ width: 620, maxHeight: "92vh", overflowY: "auto" }}>
                        <h3>{form.DealID ? "Edit" : "New"} deal</h3>
                        <div className="form-grid">
                            <div className="form-group" style={{ gridColumn: "1/-1" }}><label>Deal name (shown on the bill)</label><input style={inp} value={form.Name} onChange={e => setForm({ ...form, Name: e.target.value })} placeholder="e.g. Burger Combo" /></div>
                            <div className="form-group" style={{ gridColumn: "1/-1" }}><label>Type of deal</label>
                                <select style={inp} value={form.Type} onChange={e => setForm({ ...form, Type: e.target.value })}>{Object.entries(typeName).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></div>
                        </div>
                        {form.Type === "combo" && <div style={{ marginBottom: 10 }}><div style={{ fontWeight: 700, marginBottom: 6 }}>Customer buys all of these:</div>{itemRows}<button className="recipe-btn" onClick={() => setForm({ ...form, Items: [...form.Items, { name: "", qty: 1 }] })}>+ Add item</button></div>}
                        {form.Type !== "combo" && <div style={{ marginBottom: 10 }}>
                            <div style={{ fontWeight: 700, marginBottom: 6 }}>Which items count?</div>
                            <div style={{ display: "flex", gap: 14, marginBottom: 8, fontSize: 13, flexWrap: "wrap" }}>
                                {[["items", "Specific items"], ["category", "A whole category"], ["all", "Everything"]].filter(([k]) => k !== "all" || form.Type === "percent" || form.Type === "amount").map(([k, l]) => <label key={k}><input type="radio" checked={form.scope === k} onChange={() => setForm({ ...form, scope: k, ...(k === "all" ? { Items: [], Category: "" } : {}) })} /> {l}</label>)}
                            </div>
                            {form.scope === "items" && <>{itemRows}<button className="recipe-btn" onClick={() => setForm({ ...form, Items: [...form.Items, { name: "", qty: 1 }] })}>+ Add item</button></>}
                            {form.scope === "category" && <select style={inp} value={form.Category} onChange={e => setForm({ ...form, Category: e.target.value })}><option value="">— choose category —</option>{cats.map(c => <option key={c}>{c}</option>)}</select>}
                        </div>}
                        <div className="form-grid">
                            {form.Type === "multi" && <div className="form-group"><label>Customer buys (how many)</label><input style={inp} type="number" min="2" value={form.BuyQty} onChange={e => setForm({ ...form, BuyQty: e.target.value })} /></div>}
                            {(form.Type === "combo" || form.Type === "multi") && <div className="form-group"><label>For a fixed price of ({currency.trim()})</label><input style={inp} type="number" value={form.Price} onChange={e => setForm({ ...form, Price: e.target.value })} /></div>}
                            {(form.Type === "percent" || form.Type === "amount") && <div className="form-group"><label>{form.Type === "percent" ? "Percent off (%)" : "Amount off each item (" + currency.trim() + ")"}</label><input style={inp} type="number" value={form.Value} onChange={e => setForm({ ...form, Value: e.target.value })} /></div>}
                        </div>
                        {pv && <div style={{ background: pv.save > 0 ? "#f0fdf4" : "#fef2f2", borderRadius: 10, padding: "10px 12px", fontSize: 13, marginBottom: 12 }}>Regular price {pv.approx ? "≈ " : ""}{money(pv.reg)} → deal {money(form.Price)} · customer saves <b>{money(pv.save)}</b> {pv.save <= 0 && "⚠ the deal costs MORE than normal — it will never apply"}</div>}
                        <div style={{ fontWeight: 700, margin: "6px 0" }}>When is it on? <span style={{ fontWeight: 400, color: "#888", fontSize: 12 }}>(leave blank = always)</span></div>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
                            {D.DAYS.map(d => { const on = form.Days.includes(d); return <button key={d} onClick={() => setForm({ ...form, Days: on ? form.Days.filter(x => x !== d) : [...form.Days, d] })} style={{ padding: "6px 12px", borderRadius: 16, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 12, background: on ? "#667eea" : "#eef0fb", color: on ? "#fff" : "#555" }}>{d}</button>; })}
                        </div>
                        <div className="form-grid">
                            <div className="form-group"><label>From time</label><input style={inp} type="time" value={form.StartTime} onChange={e => setForm({ ...form, StartTime: e.target.value })} /></div>
                            <div className="form-group"><label>Until time</label><input style={inp} type="time" value={form.EndTime} onChange={e => setForm({ ...form, EndTime: e.target.value })} /></div>
                            <div className="form-group"><label>Starts on (date)</label><input style={inp} type="date" value={String(form.StartDate || "").slice(0, 10)} onChange={e => setForm({ ...form, StartDate: e.target.value })} /></div>
                            <div className="form-group"><label>Ends on (date)</label><input style={inp} type="date" value={String(form.EndDate || "").slice(0, 10)} onChange={e => setForm({ ...form, EndDate: e.target.value })} /></div>
                        </div>
                        <div className="form-group"><label>Description for customers (optional)</label><input style={inp} value={form.Description} onChange={e => setForm({ ...form, Description: e.target.value })} placeholder="e.g. Friday happy hour" /></div>
                        <div className="modal-actions"><button className="btn btn-ghost" onClick={() => setForm(null)}>Cancel</button><button className="btn btn-primary" onClick={save} disabled={saving}>{saving ? "Saving..." : "✓ Save deal"}</button></div>
                    </div></div>
                )}
            </>
        );
    }

    // ── Running costs: rent, wages, transport… so profit is real, not just "sales − ingredients" ──
    function ExpensesPage() {
        const blank = { Name: "", Category: "Transport / fuel", Amount: "", Frequency: "monthly", StartDate: dkey(new Date()), EndDate: "", Notes: "" };
        const [rows, setRows] = useState(null);
        const [currency, setCurrency] = useState("");
        const [form, setForm] = useState(null);
        const [saving, setSaving] = useState(false);
        const load = async () => {
            try { const s = window.POS_GAPI.getSettings(); if (s && s.currency) setCurrency(s.currency + " "); setRows((await window.POS_GAPI.getRows("Expenses")).filter(Boolean)); }
            catch (e) { setRows([]); alert("Could not load expenses: " + e.message + "\n(If you use Google Sheets mode, add a tab named Expenses with the columns ExpenseID, Name, Category, Amount, Frequency, StartDate, EndDate, Notes.)"); }
        };
        useEffect(() => { load(); }, []);
        if (!rows) return <div style={{ padding: 20, textAlign: "center", color: "#888" }}>Loading...</div>;
        const money = (n) => currency + Math.round(n || 0).toLocaleString();
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const perDay = expenseOnDay(rows, today);
        const mStart = new Date(today.getFullYear(), today.getMonth(), 1).getTime(), mEnd = new Date(today.getFullYear(), today.getMonth() + 1, 1).getTime();
        const monthSoFar = expenseBetween(rows, mStart, mEnd);
        const monthFull = (() => { let t = 0; for (let ms = mStart; ms < mEnd; ms += 86400000) t += expenseOnDay(rows, new Date(ms)); return t; })();
        const save = async () => {
            if (!form.Name.trim()) return alert("Enter a name.");
            if (!(parseFloat(form.Amount) >= 0) || form.Amount === "") return alert("Enter the amount.");
            setSaving(true);
            try {
                const f = { ...form, Name: form.Name.trim(), Amount: parseFloat(form.Amount) };
                if (form.ExpenseID) await window.POS_GAPI.updateRow("Expenses", 0, form.ExpenseID, f);
                else await window.POS_GAPI.appendRow("Expenses", [window.POS_GAPI.uid("EXP"), f.Name, f.Category, f.Amount, f.Frequency, f.StartDate, f.EndDate, f.Notes]);
                await load(); setForm(null);
            } catch (e) { alert("Could not save: " + e.message); }
            setSaving(false);
        };
        const del = async (r) => { if (!confirm("Delete " + r.Name + "? Past profit figures will no longer include it.\n(Tip: set an End date instead to keep history.)")) return; try { await window.POS_GAPI.deleteRow("Expenses", 0, r.ExpenseID); await load(); } catch (e) { alert(e.message); } };
        const card = { background: "#fff", borderRadius: 14, padding: 18, boxShadow: "0 2px 10px rgba(0,0,0,.06)" };
        const inp = { padding: 10, borderRadius: 8, border: "2px solid #e8e8e8", width: "100%" };
        return (
            <>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(210px,1fr))", gap: 16, marginBottom: 18 }}>
                    <div style={card}><div style={{ fontSize: 12, color: "#888" }}>Running cost per day (today)</div><div style={{ fontSize: 30, fontWeight: 800 }}>{money(perDay)}</div></div>
                    <div style={card}><div style={{ fontSize: 12, color: "#888" }}>This month so far</div><div style={{ fontSize: 30, fontWeight: 800 }}>{money(monthSoFar)}</div></div>
                    <div style={card}><div style={{ fontSize: 12, color: "#888" }}>Whole month</div><div style={{ fontSize: 30, fontWeight: 800 }}>{money(monthFull)}</div></div>
                </div>
                <div style={{ fontSize: 13, color: "#666", marginBottom: 12 }}>These are taken off your dish profit on the Dashboard, spread evenly over the days (a monthly cost is split across the days of the month), so you see real profit.</div>
                <div className="table-card">
                    <div className="table-card-header"><div className="table-card-title">Running costs</div><button className="btn btn-success" onClick={() => setForm({ ...blank })}>+ Add cost</button></div>
                    <div style={{ overflowX: "auto" }}><table className="data-table">
                        <thead><tr><th>Name</th><th>Category</th><th>Amount</th><th>How often</th><th>From</th><th>Until</th><th>Actions</th></tr></thead>
                        <tbody>
                            {rows.length === 0 && <tr><td colSpan="7" style={{ textAlign: "center", color: "#999", padding: 24 }}>No running costs yet — add rent, wages, fuel, electricity…</td></tr>}
                            {rows.map(r => <tr key={r.ExpenseID}>
                                <td><strong>{r.Name}</strong>{r.Notes ? <div style={{ fontSize: 11, color: "#999" }}>{r.Notes}</div> : null}</td>
                                <td><span className="badge badge-blue">{r.Category}</span></td>
                                <td><strong>{money(parseFloat(r.Amount))}</strong></td>
                                <td>{EXP_FREQ[String(r.Frequency).toLowerCase()] || r.Frequency}</td>
                                <td>{String(r.StartDate || "").slice(0, 10)}</td><td>{String(r.EndDate || "").slice(0, 10) || "—"}</td>
                                <td><div style={{ display: "flex", gap: 6 }}><button className="btn btn-primary" style={{ padding: "5px 11px", fontSize: 12 }} onClick={() => setForm({ ...blank, ...r, Amount: r.Amount, StartDate: String(r.StartDate || "").slice(0, 10), EndDate: String(r.EndDate || "").slice(0, 10) })}>📝 Edit</button><button className="btn btn-danger" style={{ padding: "5px 11px", fontSize: 12 }} onClick={() => del(r)}>🗑️</button></div></td>
                            </tr>)}
                        </tbody>
                    </table></div>
                </div>
                {form && (
                    <div className="modal-overlay"><div className="modal">
                        <h3>{form.ExpenseID ? "Edit" : "Add"} running cost</h3>
                        <div className="form-grid">
                            <div className="form-group" style={{ gridColumn: "1/-1" }}><label>Name</label><input style={inp} value={form.Name} onChange={e => setForm({ ...form, Name: e.target.value })} placeholder="e.g. Delivery bike fuel" /></div>
                            <div className="form-group"><label>Category</label><select style={inp} value={form.Category} onChange={e => setForm({ ...form, Category: e.target.value })}>{EXP_CATS.map(c => <option key={c}>{c}</option>)}</select></div>
                            <div className="form-group"><label>Amount ({currency.trim()})</label><input style={inp} type="number" value={form.Amount} onChange={e => setForm({ ...form, Amount: e.target.value })} /></div>
                            <div className="form-group"><label>How often</label><select style={inp} value={form.Frequency} onChange={e => setForm({ ...form, Frequency: e.target.value })}>{Object.entries(EXP_FREQ).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></div>
                            <div className="form-group"><label>{form.Frequency === "once" ? "Date" : "Starts"}</label><input style={inp} type="date" value={form.StartDate} onChange={e => setForm({ ...form, StartDate: e.target.value })} /></div>
                            {form.Frequency !== "once" && <div className="form-group"><label>Ends (optional)</label><input style={inp} type="date" value={form.EndDate} onChange={e => setForm({ ...form, EndDate: e.target.value })} /></div>}
                            <div className="form-group" style={{ gridColumn: "1/-1" }}><label>Notes (optional)</label><input style={inp} value={form.Notes} onChange={e => setForm({ ...form, Notes: e.target.value })} /></div>
                        </div>
                        <div className="modal-actions"><button className="btn btn-ghost" onClick={() => setForm(null)}>Cancel</button><button className="btn btn-primary" onClick={save} disabled={saving}>{saving ? "Saving..." : "✓ Save"}</button></div>
                    </div></div>
                )}
            </>
        );
    }

    // ── Customer ratings (food + driver) from the customer app ──
    function RatingsPage() {
        const [rows, setRows] = useState(null);
        const [err, setErr] = useState("");
        useEffect(() => {
            if (!window.POS_IS_LAN) { setErr("Ratings are available on the restaurant (LAN) server."); setRows([]); return; }
            const load = () => fetch("/api/ratings").then(r => r.json()).then(j => setRows(j.data || [])).catch(e => { setErr("Could not load ratings: " + e.message); setRows([]); });
            load(); const iv = setInterval(load, 30000); return () => clearInterval(iv);
        }, []);
        if (!rows) return <div style={{ padding: 20, textAlign: "center", color: "#888" }}>Loading ratings...</div>;
        const avg = (k) => { const v = rows.map(r => Number(r[k])).filter(x => x > 0); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10 : null; };
        const stars = (n) => n > 0 ? "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n)) : "—";
        const dist = [5, 4, 3, 2, 1].map(n => ({ n, c: rows.filter(r => Math.round(Number(r.FoodRating)) === n).length }));
        const mx = Math.max(1, ...dist.map(d => d.c));
        const byDriver = {}; rows.forEach(r => { if (r.DriverID && Number(r.DriverRating) > 0) { const d = byDriver[r.DriverID] = byDriver[r.DriverID] || { name: r.DriverName || r.DriverID, s: 0, c: 0 }; d.s += Number(r.DriverRating); d.c++; } });
        const card = { background: "#fff", borderRadius: 14, padding: 18, boxShadow: "0 2px 10px rgba(0,0,0,.06)" };
        return (
            <>
                {err && <div className="inventory-alert">{err}</div>}
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))", gap: 16, marginBottom: 18 }}>
                    <div style={card}><div style={{ fontSize: 12, color: "#888" }}>Food rating</div><div style={{ fontSize: 34, fontWeight: 800 }}>{avg("FoodRating") || "—"}</div><div style={{ color: "#f5a623", fontSize: 18 }}>{stars(avg("FoodRating") || 0)}</div></div>
                    <div style={card}><div style={{ fontSize: 12, color: "#888" }}>Driver rating</div><div style={{ fontSize: 34, fontWeight: 800 }}>{avg("DriverRating") || "—"}</div><div style={{ color: "#f5a623", fontSize: 18 }}>{stars(avg("DriverRating") || 0)}</div></div>
                    <div style={card}><div style={{ fontSize: 12, color: "#888" }}>Total ratings</div><div style={{ fontSize: 34, fontWeight: 800 }}>{rows.length}</div></div>
                    <div style={card}>{dist.map(d => <div key={d.n} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, marginBottom: 3 }}><span style={{ width: 18 }}>{d.n}★</span><div style={{ flex: 1, background: "#eee", borderRadius: 4, height: 8 }}><div style={{ width: (d.c / mx * 100) + "%", background: "#f5a623", height: 8, borderRadius: 4 }}></div></div><span style={{ width: 22, textAlign: "right" }}>{d.c}</span></div>)}</div>
                </div>
                {Object.keys(byDriver).length > 0 && <div className="table-card" style={{ marginBottom: 18 }}>
                    <div className="table-card-header"><div className="table-card-title">Drivers</div></div>
                    <table className="data-table"><thead><tr><th>Driver</th><th>Average</th><th>Ratings</th></tr></thead><tbody>
                        {Object.values(byDriver).map((d, i) => <tr key={i}><td><strong>{d.name}</strong></td><td>{Math.round(d.s / d.c * 10) / 10} <span style={{ color: "#f5a623" }}>{stars(d.s / d.c)}</span></td><td>{d.c}</td></tr>)}
                    </tbody></table></div>}
                <div className="table-card">
                    <div className="table-card-header"><div className="table-card-title">Recent ratings & comments</div></div>
                    <table className="data-table"><thead><tr><th>Date</th><th>Order</th><th>Food</th><th>Driver</th><th>Comment</th></tr></thead><tbody>
                        {rows.length === 0 && <tr><td colSpan="5" style={{ textAlign: "center", color: "#999", padding: 24 }}>No ratings yet</td></tr>}
                        {rows.slice(0, 100).map(r => <tr key={r.OrderID}>
                            <td>{r.Date ? new Date(r.Date).toLocaleString() : ""}</td><td>{window.POS_ORDER ? POS_ORDER.ticket(r) : ""}</td>
                            <td style={{ color: "#f5a623" }}>{stars(Number(r.FoodRating))}</td>
                            <td>{Number(r.DriverRating) > 0 ? <span><span style={{ color: "#f5a623" }}>{stars(Number(r.DriverRating))}</span> <span style={{ fontSize: 11, color: "#888" }}>{r.DriverName}</span></span> : "—"}</td>
                            <td style={{ maxWidth: 320 }}>{r.Comment}</td></tr>)}
                    </tbody></table>
                </div>
            </>
        );
    }

    const NAV = [
        { icon: "📊", label: "Dashboard", section: "overview" },
        { icon: "📋", label: "Menu Management", section: "menu" },
        { icon: "📦", label: "Inventory", section: "inventory" },
        { icon: "👥", label: "Staff", section: "staff" },
        { icon: "📅", label: "Rota Manager", section: "rota" },
        { icon: "🏷️", label: "Deals & Offers", section: "deals" },
        { icon: "💸", label: "Running Costs", section: "expenses" },
        { icon: "⭐", label: "Ratings", section: "ratings" },
        { icon: "🕐", label: "Team Clockings", section: "clockings" },
        { icon: "⚙️", label: "Settings", section: "settings" }
    ];

    function ManagerPortal() {
        const [active, setActive] = useState("overview");
        const [posShopName, setPosShopName] = useState(POS_SHOP.display());
        useEffect(() => {
            const h = () => setPosShopName(POS_SHOP.display());
            window.addEventListener("pos-shop-name", h); h();
            return () => window.removeEventListener("pos-shop-name", h);
        }, []);
        const [toastMsg, setToastMsg] = useState("");

        const triggerToast = (msg) => {
            setToastMsg(msg);
            setTimeout(() => setToastMsg(""), 3000);
        };

        const titles = { 
          overview: { title: "Dashboard", sub: "Live sales, orders and stock" }, 
          menu: { title: "Menu Management", sub: "Add, edit, and delete dishes" }, 
          inventory: { title: "Inventory", sub: "Track and manage stock levels" }, 
          deals: { title: "Deals & Offers", sub: "Meal deals, fixed-price combos and discounts — applied automatically at checkout" },
          expenses: { title: "Running Costs", sub: "Rent, wages, transport and other costs — taken off your profit" },
          ratings: { title: "Ratings", sub: "What customers say about the food and drivers" },
          staff: { title: "Staff Management", sub: "Add or delete team members" }, 
          rota: { title: "Rota Manager", sub: "Build and publish staff schedules" }, 
          clockings: { title: "Team Clockings", sub: "View all staff clock in/out records" },
          settings: { title: "Settings", sub: "Configure restaurant preferences and security" }
        };

        return (
            <div className="layout">
                <div className="sidebar">
                    <div className="sidebar-logo">🍽️ {posShopName} <span>Manager Portal</span></div>
                    <div className="nav-section">Main</div>
                    {NAV.map(n => (
                        <div key={n.section} className={`nav-item ${active === n.section ? 'active' : ''}`} onClick={() => setActive(n.section)}>
                            <span className="icon">{n.icon}</span>{n.label}
                        </div>
                    ))}
                    <div className="sidebar-bottom" style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                        <div id="user-badge" style={{ fontSize: '12px', color: 'rgba(255,255,255,.5)' }}></div>
                        <div style={{ display: 'flex', gap: '6px' }}>
                            <button onClick={() => { if (window.POS_AUTH) window.POS_AUTH.openSheet(); }}
                              style={{
                                flex: 1,
                                background: "rgba(39,174,96,.15)",
                                border: "1px solid rgba(39,174,96,.3)",
                                color: "#27ae60",
                                padding: "6px",
                                borderRadius: "8px",
                                fontSize: "11px",
                                fontWeight: 700,
                                cursor: "pointer"
                              }}>
                              📊 Sheet
                            </button>
                            <button onClick={() => location.reload()}
                              style={{
                                flex: 1,
                                background: "rgba(255,255,255,.08)",
                                border: "1px solid rgba(255,255,255,.1)",
                                color: "rgba(255,255,255,.5)",
                                padding: "6px",
                                borderRadius: "8px",
                                fontSize: "11px",
                                fontWeight: 700,
                                cursor: "pointer"
                              }}>
                              🔄 Refresh
                            </button>
                        </div>
                    </div>
                </div>
                <div className="main">
                    <div className="page-header">
                        <div>
                            <div className="page-title">{titles[active].title}</div>
                            <div className="page-subtitle">{titles[active].sub}</div>
                        </div>
                    </div>
                    <div className="page-content">
                        {active === "overview" && <Dashboard />}
                        {active === "menu" && <MenuManagement toast={triggerToast} />}
                        {active === "inventory" && <Inventory />}
                        {active === "staff" && <StaffWithDrivers toast={triggerToast} />}
                        {active === "rota" && <RotaManager />}
                        {active === "deals" && <DealsPage />}
                        {active === "expenses" && <ExpensesPage />}
                        {active === "ratings" && <RatingsPage />}
                        {active === "clockings" && <TeamClockings />}
                        {active === "settings" && <SettingsPage toast={triggerToast} />}
                    </div>
                </div>
                {toastMsg && <div className="notification-toast">{toastMsg}</div>}
            </div>
        );
    }

    window._doRenderPortal = function() { 
        ReactDOM.createRoot(document.getElementById('root')).render(<ManagerPortal />); 
    };
</script>

<script>
// Manager portal auth: PIN required, React renders only after PIN verified
(function() {
  document.getElementById("root").innerHTML =
    '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
    'background:#f0f2f5;flex-direction:column;gap:16px;font-family:sans-serif;">' +
    '<div style="font-size:48px">🍽️</div>' +
    '<div style="font-size:20px;font-weight:700;color:#667eea">Manager Portal</div>' +
    '<div style="font-size:14px;color:#888" id="mp-status">Checking auth...</div>' +
    '</div>';

  function setStatus(msg) {
    var el = document.getElementById("mp-status");
    if (el) el.textContent = msg;
  }

  function boot() {
    if (typeof POS_AUTH === "undefined" || typeof POS_GAPI === "undefined") {
      setStatus("Loading scripts...");
      setTimeout(boot, 200); return;
    }

    setStatus("Checking session...");

    if (window.POS_IS_LAN) {            // LAN: no Google sign-in, just the PIN
      POS_GAPI.initUserSheet().then(function() {
        setStatus("Verifying PIN...");
        showPinModal(POS_GAPI.getSession());
      }).catch(function(e) { setStatus("Cannot reach the restaurant server: " + e.message); });
      return;
    }

    var savedRaw = localStorage.getItem("pos_session");
    if (!savedRaw) {
      window.location.href = "index.html?redirect=" + encodeURIComponent(location.href);
      return;
    }

    POS_GAPI.loadLibraries().then(function() {
      setStatus("Signing in...");
      POS_GAPI.silentSignIn(function(session) {
        if (!session) {
          window.location.href = "index.html?redirect=" + encodeURIComponent(location.href);
          return;
        }
        POS_GAPI.initUserSheet().catch(function(){}).then(function() {
          setStatus("Verifying PIN...");
          showPinModal(session);
        });
      });
    }).catch(function(e) {
      setStatus("Error loading Google APIs: " + e.message);
    });
  }

  function showPinModal(session) {
    document.getElementById("root").innerHTML =
      '<div style="position:fixed;inset:0;background:rgba(7,7,15,.97);display:flex;' +
      'align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,sans-serif;">' +
      '<div style="background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:24px;' +
      'padding:40px 32px;width:320px;text-align:center;box-shadow:0 40px 100px rgba(0,0,0,.7);">' +
      '<div style="font-size:48px;margin-bottom:14px">🔐</div>' +
      '<h2 style="color:#fff;font-size:20px;font-weight:800;margin-bottom:6px">Manager Access</h2>' +
      '<p style="color:rgba(255,255,255,.4);font-size:13px;margin-bottom:28px">' +
        session.name + '<br>Enter your 4-digit PIN</p>' +
      '<div style="display:flex;justify-content:center;gap:14px;margin-bottom:28px" id="pin-dots">' +
        [0,1,2,3].map(function(i){ return '<div id="pd'+i+'" style="width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:transparent;transition:all .15s"></div>'; }).join('') +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">' +
        [1,2,3,4,5,6,7,8,9,"","0","⌫"].map(function(k){
          return '<button data-k="'+k+'" style="padding:15px 0;border-radius:12px;border:1px solid rgba(255,255,255,.08);' +
            'background:rgba(255,255,255,.05);color:#fff;font-size:20px;font-weight:600;cursor:pointer;' +
            (k===""?"opacity:0;pointer-events:none;":"") + '" ' +
            'onmousedown="this.style.background=\'rgba(243,156,18,.25)\'" ' +
            'onmouseup="this.style.background=\'rgba(255,255,255,.05)\'">' + k + '</button>';
        }).join('') +
      '</div>' +
      '<div id="pin-err" style="color:#e74c3c;font-size:13px;min-height:18px;margin-bottom:12px"></div>' +
      '<button onclick="localStorage.removeItem(\'pos_session\');location.href=\'index.html\'" ' +
        'style="background:none;border:none;color:rgba(255,255,255,.25);font-size:12px;cursor:pointer;">Sign out</button>' +
      '</div></div>';

    var entered = "";
    function updateDots() {
      [0,1,2,3].forEach(function(i) {
        var d = document.getElementById("pd"+i);
        if (!d) return;
        d.style.background  = i < entered.length ? "#f39c12" : "transparent";
        d.style.borderColor = i < entered.length ? "#f39c12" : "rgba(255,255,255,.2)";
      });
    }

    document.querySelectorAll("[data-k]").forEach(function(btn) {
      var k = btn.dataset.k;
      if (!k) return;
      btn.addEventListener("click", function() {
        if (k === "⌫") { entered = entered.slice(0,-1); document.getElementById("pin-err").textContent=""; updateDots(); return; }
        if (entered.length >= 4) return;
        entered += k; updateDots();
        if (entered.length === 4) {
          POS_GAPI.Settings.verifyPin(entered).then(function(res) {
            if (res && res.data && res.data.verified) {
              document.getElementById("root").innerHTML = "";
              if (typeof window._doRenderPortal === "function") {
                window._doRenderPortal();
              }
              setTimeout(function() {
                if (typeof POS_AUTH !== "undefined" && typeof POS_AUTH.renderUtilBar === "function") {
                  POS_AUTH.renderUtilBar("user-badge","manager-portal");
                }
              }, 600);
            } else {
              document.getElementById("pin-err").textContent = "Incorrect PIN — try again";
              entered = ""; updateDots();
            }
          }).catch(function() {
            if (entered === "1234") {
              document.getElementById("root").innerHTML = "";
              if (typeof window._doRenderPortal === "function") window._doRenderPortal();
            } else {
              document.getElementById("pin-err").textContent = "Incorrect PIN — try again";
              entered = ""; updateDots();
            }
          });
        }
      });
    });
  }

  var attempts = 0;
  var iv = setInterval(function() {
    attempts++;
    if (typeof POS_AUTH !== "undefined" && typeof POS_GAPI !== "undefined") {
      clearInterval(iv); boot();
    } else if (attempts > 60) {
      clearInterval(iv);
      setStatus("Error: pos-config.js not loading. Upload it to GitHub.");
    }
  }, 100);
})();
</script>
</body>
</html>
