<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Prep Display — The Grand Table</title>
<script src="pos-config.js"></script>
<script src="pos-api.js"></script>
<script src="pos-gapi.js"></script>
<script src="pos-auth.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#0d1117;color:#e6edf3;min-height:100vh;}

/* HEADER */
.header{background:linear-gradient(135deg,#f39c12,#e67e22);
  padding:14px 24px;display:flex;justify-content:space-between;
  align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4);}
.header h1{font-size:22px;font-weight:700;color:black;}
.header-right{display:flex;gap:14px;align-items:center;font-size:13px;}
.queue-count{background:rgba(0,0,0,.2);padding:5px 14px;
  border-radius:10px;font-weight:700;color:black;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:320px 1fr;
  height:calc(100vh - 58px);}

/* CHEF SELECTION HOME SCREEN */
.chef-screen {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:calc(100vh - 58px);
  background:#111827;
  padding:40px;
  text-align:center;
}
.chef-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:16px;
  width:100%;
  max-width:600px;
  margin-top:24px;
}
.chef-card {
  padding:24px 16px;
  border-radius:14px;
  border:2px solid #30363d;
  background:#1f2937;
  cursor:pointer;
  transition:all 0.2s;
}
.chef-card:hover {
  border-color:#f39c12;
  background:#2d2209;
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(243,156,18,0.15);
}
.chef-avatar {
  width:50px; height:50px;
  border-radius:50%;
  background:linear-gradient(135deg,#f39c12,#e67e22);
  color:black;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:800;
  margin:0 auto 12px;
}
.chef-name { font-weight:700; font-size:14px; color:#e6edf3; }

/* QUEUE PANEL */
.queue-panel{background:#161b22;border-right:1px solid #30363d;
  overflow-y:auto;padding:14px;}
.queue-title{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:#8b949e;margin-bottom:12px;}
.queue-item{background:#21262d;border-radius:10px;padding:13px;
  margin-bottom:8px;cursor:pointer;border:2px solid transparent;
  transition:all .2s;position:relative;}
.queue-item:hover{border-color:#f39c12;}
.queue-item.active{border-color:#f39c12;background:#2d2209;}
.qi-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.qi-order{font-weight:700;font-size:14px;}
.qi-table{font-size:12px;color:#8b949e;}
.qi-dish{font-size:13px;color:#f39c12;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.qty-pill{background:#f39c12;color:black;font-weight:900;font-size:11px;padding:1px 6px;border-radius:6px;}
.qi-note{font-size:11px;color:#8b949e;background:#0d1117;
  padding:4px 8px;border-radius:5px;margin-top:5px;}
.urgency-dot{display:inline-block;width:8px;height:8px;
  border-radius:50%;margin-right:5px;}
.urg-high{background:#e74c3c;animation:urgpulse 1s infinite;}
.urg-med{background:#f39c12;}
.urg-low{background:#27ae60;}
@keyframes urgpulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Live Background Timer badge */
.qi-timer-badge {
  position:absolute;
  bottom:10px;
  right:10px;
  background:#f39c12;
  color:black;
  font-size:10px;
  font-weight:900;
  padding:2px 8px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(243,156,18,0.25);
  animation:cookingpulse 1.5s infinite;
}
@keyframes cookingpulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

/* RECIPE PANEL */
.recipe-panel{display:flex;flex-direction:column;overflow:hidden;}

/* No selection / Welcome state */
.no-selection{display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;color:#8b949e;text-align:center;padding:40px;}
.ns-icon{font-size:64px;margin-bottom:16px;}
.ns-title{font-size:18px;font-weight:700;margin-bottom:6px;}

/* Loading */
.loading-recipe{display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;color:#8b949e;}
.loading-spin{font-size:40px;animation:spin 1.5s linear infinite;margin-bottom:14px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Interactive Check Popup Views */
.gate-modal {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; background:#161b22; padding:40px; text-align:center;
}
.gate-card {
  background:#21262d; border:1px solid #30363d; border-radius:18px;
  padding:32px; max-width:480px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.5);
}
.gate-icon { font-size:64px; margin-bottom:16px; }
.gate-title { font-size:22px; font-weight:800; color:white; margin-bottom:8px; }
.gate-sub { font-size:14px; color:#8b949e; line-height:1.6; margin-bottom:20px; }
.gate-btn {
  width:100%; padding:14px; border:none; border-radius:10px;
  background:linear-gradient(135deg,#f39c12,#e67e22); color:black;
  font-weight:800; font-size:16px; cursor:pointer; transition:transform 0.15s;
}
.gate-btn:active { transform:scale(0.98); }

.batch-pill {
  display:inline-block;
  background:#e67e22;
  color:white;
  font-weight:800;
  font-size:12px;
  padding:3px 10px;
  border-radius:12px;
  margin-bottom:12px;
}

/* Checklist */
.ing-check-list { text-align:left; max-height:220px; overflow-y:auto; margin-bottom:20px; background:#0d1117; padding:12px; border-radius:8px; }
.ing-check-item { display:flex; gap:10px; align-items:center; padding:7px 0; font-size:13px; color:#c9d1d9; border-bottom:1px solid #161b22; }
.ing-check-item:last-child { border-bottom:none; }

/* Dynamic focused active cook step style */
.focused-cooking-box {
  display:flex; flex-direction:column; flex:1; padding:20px; background:#080a10; overflow-y:auto;
}
.focus-step-card {
  flex:1; min-height:220px; background:#111420; border:2px solid #f39c12; border-radius:16px;
  padding:40px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; text-align:center; box-shadow:0 10px 30px rgba(243,156,18,0.1);
  margin-bottom:20px;
}
.focus-step-num {
  background:#f39c12; color:black; font-weight:900; font-size:16px;
  padding:4px 16px; border-radius:20px; text-transform:uppercase; margin-bottom:18px;
}
.focus-step-title { font-size:32px; font-weight:800; color:white; margin-bottom:14px; }
.focus-step-desc { font-size:19px; line-height:1.7; color:#c9d1d9; max-width:680px; }
.focus-step-tip {
  margin-top:20px; font-size:14px; color:#f39c12; background:rgba(243,156,18,0.08);
  padding:10px 18px; border-radius:8px; border-left:4px solid #f39c12; max-width:600px;
}

/* Timeline Preview */
.timeline-track {
  display:grid; grid-template-columns:repeat(auto-fit, minmax(100px, 1fr)); gap:10px;
}
.timeline-step {
  background:#161b22; border-radius:8px; padding:10px; border-left:3px solid #30363d;
  opacity:0.5; font-size:11px;
}
.timeline-step.active { border-left-color:#f39c12; background:#1c1e10; opacity:1; }
.timeline-step.done { border-left-color:#27ae60; background:#0d1a10; opacity:0.8; }
.timeline-name { font-weight:700; color:white; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Recipe header */
.recipe-header{background:#161b22;border-bottom:1px solid #30363d;padding:18px 22px;}
.recipe-title{font-size:26px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.recipe-meta{display:flex;gap:18px;font-size:13px;color:#8b949e;flex-wrap:wrap;}
.recipe-meta span{display:flex;align-items:center;gap:4px;}
.meta-ok{color:#27ae60;}
.meta-warn{color:#f39c12;}

/* Content grid */
.recipe-content{display:grid;grid-template-columns:1fr 300px;
  flex:1;overflow:hidden;}

/* Steps */
.steps-section{padding:18px 20px;overflow-y:auto;}
.section-lbl{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:#8b949e;margin-bottom:12px;}

.step-card{background:#161b22;border-radius:10px;padding:15px;
  margin-bottom:10px;border-left:4px solid #30363d;transition:all .2s;}
.step-card.s-active{border-left-color:#f39c12;background:#1c1e10;}
.step-card.s-done{border-left-color:#27ae60;opacity:.75;}
.step-header{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.step-num{width:30px;height:30px;border-radius:50%;background:#30363d;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex-shrink:0;transition:all .2s;}
.s-active .step-num{background:#f39c12;color:#000;}
.s-done  .step-num{background:#27ae60;color:#fff;}
.step-title-text{font-weight:700;font-size:15px;flex:1;}
.step-dur{font-size:11px;color:#8b949e;background:#0d1117;
  padding:3px 10px;border-radius:10px;flex-shrink:0;}
.step-desc{font-size:13px;line-height:1.7;color:#c9d1d9;margin-left:40px;}
.step-tip{margin-left:40px;margin-top:7px;font-size:12px;color:#f39c12;
  background:rgba(243,156,18,.1);padding:6px 10px;border-radius:6px;
  border-left:3px solid #f39c12;}
.step-actions{margin-left:40px;margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
.done-btn{padding:7px 14px;background:#27ae60;color:#fff;border:none;
  border-radius:7px;cursor:pointer;font-weight:700;font-size:12px;}
.undo-btn{padding:7px 14px;background:#30363d;color:#aaa;border:none;
  border-radius:7px;cursor:pointer;font-weight:700;font-size:12px;}

/* Side panel */
.side-panel{background:#161b22;border-left:1px solid #30363d;
  overflow-y:auto;padding:18px;}

/* Big timer */
.big-timer-box{background:#21262d;border-radius:12px;padding:18px;
  text-align:center;margin-bottom:18px;}
.bt-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;
  color:#8b949e;margin-bottom:6px;}
.bt-display{font-size:52px;font-weight:900;font-family:'Courier New',monospace;
  color:#f39c12;line-height:1;margin-bottom:6px;}
.bt-display.urgent{color:#e74c3c;animation:urgblink .7s infinite;}
.bt-display.done-color{color:#27ae60;}
@keyframes urgblink{0%,100%{opacity:1}50%{opacity:.2}}
.bt-controls{display:flex;gap:8px;justify-content:center;}
.bt-ctrl{padding:8px 16px;border:none;border-radius:7px;
  cursor:pointer;font-weight:700;font-size:12px;}
.bt-pause{background:#f39c12;color:#000;}
.bt-stop{background:#30363d;color:#aaa;}

/* Ingredients */
.ing-row{display:flex;justify-content:space-between;align-items:flex-start;
  padding:10px 0;border-bottom:1px solid #21262d;font-size:13px;gap:8px;}
.ing-row:last-child{border-bottom:none;}
.ing-name{color:#c9d1d9;flex:1;}
.ing-amt{color:#f39c12;font-weight:700;font-size:12px;text-align:right;white-space:nowrap;}
</style>
</head>
<body>

<div id="app" style="display:none">
  <!-- Chef selection screen overlay -->
  <div id="chef-overlay" class="chef-screen">
    <div style="font-size:56px">👨‍🍳</div>
    <h2 style="font-size:26px;font-weight:800;color:white;margin-top:12px">Select Your Cooking Station</h2>
    <p style="color:#8b949e;margin-top:4px">Choose your name to load active tickets</p>
    <div class="chef-grid" id="chef-grid"></div>
  </div>

  <div id="main-panel" style="display:none">
    <div class="header">
      <div style="display:flex; align-items:center; gap:12px;">
         <img src="input_file_1.jpeg" style="width:48px; height:48px; object-fit:contain; mix-blend-mode:multiply;" alt="🔥" onerror="this.style.display='none'">
         <h1>👨‍🍳 Kitchen Prep Display</h1>
      </div>
      <div class="header-right">
        <button onclick="doSignOutChef()" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; padding:4px 12px; border-radius:8px; font-size:11px; cursor:pointer; margin-right:8px;">↩ Switch Station</button>
        <span id="chef-badge" style="font-weight:700; color:black; background:white; padding:4px 12px; border-radius:8px; margin-right:8px;">Chef: —</span>
        <div class="queue-count" id="queue-count">0 dishes</div>
        <div id="user-badge" style="display:flex;align-items:center;gap:6px;"></div>
        <span id="hdr-time" style="opacity:.7"></span>
      </div>
    </div>

    <div class="layout">
      <!-- QUEUE -->
      <div class="queue-panel">
        <div class="queue-title">Dish Queue</div>
        <div id="queue-list">
          <div class="queue-empty">
            <div style="font-size:32px;margin-bottom:8px">⏳</div>
            Loading orders…
          </div>
        </div>
      </div>

      <!-- RECIPE INTERACTIVE BOARD -->
      <div class="recipe-panel" id="recipe-panel">
        <div class="no-selection">
          <div class="ns-icon">👈</div>
          <div class="ns-title">Select a dish from the queue</div>
          <p style="font-size:14px;margin-top:6px">Tap any dish to see step-by-step recipe</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="loading-placeholder" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;font-family:sans-serif;background:#0d1117;color:#e6edf3;">
  <div style="font-size:40px">👨‍🍳</div>
  <div style="font-size:16px;font-weight:700">Prep Display</div>
  <div style="font-size:13px;color:#888">Verifying chef station...</div>
</div>

<script>
// ── STATE ──
var STATE = {
  currentChef     : null,
  staff           : [],
  queue           : [],
  selected        : null,  
  recipe          : null,  
  doneSteps       : [],    
  timers          : {},
  selectedKey     : null,
  globalIntervalId: null,
  queueIntervalId : null,
  gateState       : "none",
  inFlightFinished: {},
  availableRecipes: {}
};

var FALLBACK_RECIPES = {
  "Coffee": {
    prepTime: "2 min", cookTime: "3 min", difficulty: "Easy",
    ingredients: [
      { name: "Coffee beans (ground)", amount: "18g" },
      { name: "Hot water (93°C)", amount: "200ml" },
      { name: "Milk / Sugar", amount: "Optional" }
    ],
    steps: [
      { title: "Grind & Dose", description: "Grind 18g fresh coffee beans into portafilter / filter.", timerSec: 30, tip: "Level and tamp evenly." },
      { title: "Brew & Extract", description: "Extract with 93°C hot water. Target 30-36g espresso output.", timerSec: 30, tip: "Watch for golden crema." },
      { title: "Steam Milk & Serve", description: "Steam fresh milk if requested and pour into cup.", timerSec: 60, tip: "Serve hot immediately." }
    ]
  },
  "Burger Deluxe":{
    prepTime:"5 min",cookTime:"12 min",difficulty:"Easy",
    ingredients:[
      {name:"Beef patty (180g)",amount:"1 pc"},{name:"Brioche bun",amount:"1 pc"},
      {name:"Cheddar cheese",amount:"2 slices"},{name:"Lettuce",amount:"2 leaves"},
      {name:"Tomato",amount:"2 slices"},{name:"Special sauce",amount:"1 tbsp"},
      {name:"Fries (frozen)",amount:"150g"}
    ],
    steps:[
      {title:"Prep Ingredients",   description:"Slice tomatoes and lettuce. Pat patty dry. Season both sides with salt and pepper.",timerSec:120,  tip:"Patty at room temp for even cooking."},
      {title:"Cook Fries",         description:"Place fries in fryer at 180°C. Shake halfway through.",                               timerSec:300,  tip:"Don't overcrowd the basket!"},
      {title:"Grill the Patty",    description:"Place on hot grill. DO NOT move. Cook 4 min first side without moving.",              timerSec:240,  tip:"Resist pressing — keeps juices in."},
      {title:"Add Cheese & Toast", description:"Add cheese on patty. Place bun face-down on grill. Wait until melted.",               timerSec:60,   tip:null},
      {title:"Assemble & Serve",   description:"Bottom bun → sauce → lettuce → tomato → patty → pickles → top bun.",                 timerSec:45,   tip:"Serve immediately!"}
    ]
  },
  "Steak":{
    prepTime:"5 min",cookTime:"15 min",difficulty:"Medium",
    ingredients:[
      {name:"Ribeye steak (250g)",amount:"1 pc"},{name:"Butter",amount:"30g"},
      {name:"Garlic cloves",amount:"3 pcs"},{name:"Rosemary",amount:"2 sprigs"},
      {name:"Sea salt & pepper",amount:"To taste"},{name:"Olive oil",amount:"1 tbsp"}
    ],
    steps:[
      {title:"Bring to Room Temp",description:"Remove from fridge 15 min before. Pat dry with paper towel.",timerSec:900,tip:"Dry surface = better sear."},
      {title:"Season Generously", description:"Season all sides firmly with sea salt and black pepper.",      timerSec:30, tip:null},
      {title:"Heat Pan",          description:"Cast iron on highest heat 3 minutes until smoking.",           timerSec:180,tip:"Pan must be screaming hot."},
      {title:"Sear First Side",   description:"Place steak away from you. DO NOT MOVE. 2.5 min.",            timerSec:150,tip:"Look for deep brown crust."},
      {title:"Flip & Baste",      description:"Flip. Add butter, garlic, rosemary. Baste continuously.",     timerSec:120,tip:"Basting constantly = more flavour."},
      {title:"Rest the Steak",    description:"Remove from heat. Tent with foil. Rest 5 min — mandatory.",   timerSec:300,tip:"Never skip — juices redistribute."},
      {title:"Slice & Plate",     description:"Slice against the grain. Pour resting juices over.",          timerSec:45, tip:null}
    ]
  }
};

function getPosApi() {
  return window.POS_GAPI || window.POS_API || null;
}

function cleanDishName(name) {
  if (!name) return "";
  return String(name)
    .replace(/\(.*?\)/g, "")
    .replace(/[-–—].*$/g, "")
    .replace(/#\d+/g, "")
    .trim()
    .toLowerCase();
}

function findRecipeForDish(dishName) {
  if (!dishName) return null;
  var exact = dishName.trim().toLowerCase();
  if (STATE.availableRecipes[exact]) return STATE.availableRecipes[exact];
  
  var cleaned = cleanDishName(dishName);
  if (STATE.availableRecipes[cleaned]) return STATE.availableRecipes[cleaned];

  for (var k in STATE.availableRecipes) {
    if (k === exact || k === cleaned || exact.startsWith(k) || k.startsWith(cleaned)) {
      return STATE.availableRecipes[k];
    }
  }

  return FALLBACK_RECIPES[dishName] || FALLBACK_RECIPES[cleaned] || null;
}

function safeParseItems(raw) {
  if (Array.isArray(raw)) return raw;
  if (!raw || typeof raw !== "string") return [];
  var trimmed = raw.trim();

  try {
    var res = JSON.parse(trimmed);
    if (Array.isArray(res)) return res;
    if (typeof res === "string") return safeParseItems(res);
  } catch(e){}

  try {
    var fixed = trimmed.replace(/'/g, '"');
    var res2 = JSON.parse(fixed);
    if (Array.isArray(res2)) return res2;
  } catch(e){}

  var items = [];
  trimmed.split(",").forEach(function(part) {
    var p = part.trim();
    if (p) items.push({ name: p, qty: 1 });
  });
  return items;
}

function formatIngredientAmount(rawAmount, qty) {
  var count = parseInt(qty, 10) || 1;
  if (!rawAmount || count <= 1) return rawAmount || "—";
  var trimmed = String(rawAmount).trim();

  var match = trimmed.match(/^([\d\.]+)\s*(.*)$/);
  if (match) {
    var num = parseFloat(match[1]);
    var unit = match[2] || "";
    if (!isNaN(num)) {
      var scaled = Math.round(num * count * 100) / 100;
      if (unit === "pc" && scaled > 1) unit = "pcs";
      if (unit === "slice" && scaled > 1) unit = "slices";
      if (unit === "leaf" && scaled > 1) unit = "leaves";
      if (unit === "clove" && scaled > 1) unit = "cloves";
      if (unit === "sprig" && scaled > 1) unit = "sprigs";
      return scaled + (unit ? " " + unit : "") + " (" + trimmed + " × " + count + ")";
    }
  }
  return trimmed + " (×" + count + ")";
}

function tickClock() {
  var el = document.getElementById("hdr-time");
  if (el) el.textContent = new Date().toLocaleTimeString("en-GB");
}

function doSignOutChef() {
  if (STATE.queueIntervalId) {
    clearInterval(STATE.queueIntervalId);
    STATE.queueIntervalId = null;
  }
  if (STATE.globalIntervalId) {
    clearInterval(STATE.globalIntervalId);
    STATE.globalIntervalId = null;
  }
  STATE.timers = {};
  STATE.currentChef = null;
  STATE.selected = null;
  STATE.recipe = null;
  STATE.selectedKey = null;
  STATE.gateState = "none";
  document.getElementById("main-panel").style.display = "none";
  document.getElementById("chef-overlay").style.display = "flex";
  loadChefSelection();
}

function loadChefSelection() {
  var api = getPosApi();
  var container = document.getElementById("chef-grid");
  if (!container) return;

  function renderGrid(names) {
    container.innerHTML = names.map(function(name) {
      return '<div class="chef-card" onclick="selectChef(\'' + name.replace(/'/g, "\\'") + '\')">' +
        '<div class="chef-avatar">' + name.charAt(0).toUpperCase() + '</div>' +
        '<div class="chef-name">' + name + '</div>' +
        '</div>';
    }).join("");
  }

  if (api && api.Staff && typeof api.Staff.getAll === "function") {
    api.Staff.getAll().then(function(res) {
      if (res && res.data && res.data.length > 0) {
        var chefs = res.data.filter(function(s) {
          var role = (s.Role || s.role || "").toLowerCase();
          var status = (s.Status || s.status || "active").toLowerCase();
          return status === "active" && role !== "driver";
        }).map(function(s){ return s.Name || s.StaffName || s.ChefName || s.name; });
        renderGrid(chefs.length > 0 ? chefs : ["Head Chef", "Line Cook 1", "Line Cook 2"]);
      } else {
        renderGrid(["Head Chef", "Line Cook 1", "Line Cook 2"]);
      }
    }).catch(function() {
      renderGrid(["Head Chef", "Line Cook 1", "Line Cook 2"]);
    });
  } else {
    renderGrid(["Head Chef", "Line Cook 1", "Line Cook 2"]);
  }
}

function selectChef(name) {
  STATE.currentChef = name;
  document.getElementById("chef-badge").textContent = "Chef: " + name;
  document.getElementById("chef-overlay").style.display = "none";
  document.getElementById("main-panel").style.display = "block";

  if (STATE.queueIntervalId) clearInterval(STATE.queueIntervalId);
  loadQueue();
  var pollMs = (window.POS_CONFIG && window.POS_CONFIG.POLL_MS) || 4000;
  STATE.queueIntervalId = setInterval(loadQueue, pollMs);

// ── SYNC QUEUE FROM GOOGLE SHEETS ──
function loadQueue() {
  var api = getPosApi();
  
  if (!api || !api.Orders || typeof api.Orders.getAll !== "function") {
    STATE.availableRecipes = FALLBACK_RECIPES;
    STATE.queue = [
      { key:"ORD-001#0#Burger Deluxe", orderId:"ORD-001", itemIdx:0, table:3, dish:"Burger Deluxe", qty:2, note:"No onions on one", urgency:"high", status:"new" },
      { key:"ORD-002#0#Steak", orderId:"ORD-002", itemIdx:0, table:5, dish:"Steak", qty:1, note:"Medium rare", urgency:"med", status:"new" }
    ];
    renderQueue();
    return;
  }

  // Preload recipes
  var recipePromise = (api.Recipes && typeof api.Recipes.getAll === "function") 
    ? api.Recipes.getAll().then(function(res) {
        var rMap = {};
        if (res && res.data) {
          res.data.forEach(function(r) {
            var dishName = (r.DishName || r.Dish || r.Name || r.ItemName || r.Title || r.dish || r.name || "").trim().toLowerCase();
            if (dishName) {
              rMap[dishName] = r;
              rMap[cleanDishName(dishName)] = r;
            }
          });
        }
        STATE.availableRecipes = rMap;
      }).catch(function(){})
    : Promise.resolve();

  recipePromise.then(function() {
    return api.Orders.getAll();
  }).then(function(res) {
    var orders = (res && res.data) ? res.data : [];
    
    // Only load active orders
    var activeOrders = orders.filter(function(o) {
      var st = (o.Status || o.status || "").toLowerCase().trim();
      return st === "new" || st === "preparing";
    });

    STATE.queue = buildQueueFromOrders(activeOrders);
    renderQueue();
  }).catch(function(err) {
    console.error("Kitchen Prep: error loading queue from sheet:", err);
    renderQueue();
  });
}

function buildQueueFromOrders(orders) {
  var items = [];
  orders.forEach(function(order) {
    try {
      var rawItems = order.Items || order.items || order.OrderItems || [];
      var orderItems = safeParseItems(rawItems);
      var orderId = order.OrderID || order.OrderId || order.orderId || order.id || "ORD";
      var tableNo = order.TableNumber || order.Table || order.TableNo || order.table || "—";
      var orderNotes = order.Notes || order.notes || "";

      orderItems.forEach(function(item, itemIdx) {
        var dishName = item.name || item.Name || item.dish || item.Dish || item.Item || item.title || "";
        if (!dishName) return;

        var itemStatus = (item.status || "new").toLowerCase().trim();
        var uniqueItemKey = orderId + "#" + itemIdx + "#" + dishName;

        // 1. Skip if completed in-flight
        if (STATE.inFlightFinished[uniqueItemKey]) return;

        // 2. Hide completed/ready items
        if (["ready", "completed", "served", "done", "cancelled", "void"].includes(itemStatus)) {
          return;
        }

        // 3. HIDE ITEM if another chef has claimed / is cooking it
        if (itemStatus === "preparing" && item.chef && item.chef !== STATE.currentChef) {
          return;
        }

        // 4. HIDE ONLY IF EXPLICITLY MARKED "Bypass Prep"
        var prepTime = (item.prepTime || item.PrepTime || "").trim();
        if (prepTime.toLowerCase() === "bypass prep") {
          return;
        }

        var elapsed = order.OrderTime || order.orderTime
          ? (Date.now() - new Date(order.OrderTime || order.orderTime).getTime()) / 60000 : 0;

        items.push({
          key     : uniqueItemKey,
          orderId : orderId,
          itemIdx : itemIdx,
          table   : tableNo,
          dish    : dishName,
          qty     : parseInt(item.quantity || item.qty || item.Qty || 1, 10),
          note    : item.note || item.Notes || orderNotes,
          chef    : item.chef || "",
          status  : itemStatus,
          urgency : elapsed > 15 ? "high" : elapsed > 8 ? "med" : "low"
        });
      });
    } catch(e) {
      console.warn("Kitchen Prep: error parsing order items", e);
    }
  });
  return items;
}

function renderQueue() {
  var el = document.getElementById("queue-list");
  if (!el) return;

  document.getElementById("queue-count").textContent = STATE.queue.length + " dishes";

  if (!STATE.queue.length) {
    el.innerHTML = '<div class="no-selection" style="padding:20px 10px;"><div style="font-size:32px;margin-bottom:8px">✅</div><div style="font-weight:700">All caught up!</div></div>';
    return;
  }

  el.innerHTML = STATE.queue.map(function(item, idx) {
    var key = item.key;
    var isActive = STATE.selectedKey === key;
    var backgroundTimer = STATE.timers[key];
    var timerBadgeHtml = "";

    if (backgroundTimer && backgroundTimer.running && backgroundTimer.remaining > 0) {
      var m = Math.floor(backgroundTimer.remaining / 60);
      var s = backgroundTimer.remaining % 60;
      timerBadgeHtml = '<div class="qi-timer-badge">🔥 Cook ' + String(m).padStart(2, "0") + ':' + String(s).padStart(2, "0") + '</div>';
    } else if (backgroundTimer && !backgroundTimer.running && backgroundTimer.remaining === 0) {
      timerBadgeHtml = '<div class="qi-timer-badge" style="background:#27ae60; color:white;">✅ Done</div>';
    }

    return '<div class="queue-item' + (isActive ? " active" : "") + '" onclick="selectDish(' + idx + ')">' +
      '<div class="qi-header">' +
        '<span class="qi-order">' + item.orderId + '</span>' +
        '<span class="qi-table">Table ' + item.table + '</span>' +
      '</div>' +
      '<div class="qi-dish">' +
        '<span class="urgency-dot urg-' + item.urgency + '"></span>' +
        (item.qty > 1 ? '<span class="qty-pill">x' + item.qty + '</span> ' : '') +
        item.dish +
      '</div>' +
      (item.note ? '<div class="qi-note">⚠️ ' + item.note + '</div>' : '') +
      timerBadgeHtml +
    '</div>';
  }).join("");
}

function selectDish(idx) {
  var item = STATE.queue[idx];
  if (!item) return;

  var key = item.key;
  STATE.selectedKey = key;
  STATE.selected = item;
  STATE.doneSteps = [];
  STATE.gateState = "none";

  renderQueue();

  var backgroundTimer = STATE.timers[key];
  if (backgroundTimer && backgroundTimer.recipeData) {
    STATE.recipe = backgroundTimer.recipeData;
    renderRecipe();
    return;
  }

  document.getElementById("recipe-panel").innerHTML =
    '<div class="loading-recipe"><div class="loading-spin">⚙️</div>' +
    '<div>Loading recipe for ' + item.dish + '…</div></div>';

  var matched = findRecipeForDish(item.dish);
  if (matched && (matched.Steps || matched.steps)) {
    var steps = typeof matched.Steps === "string" ? JSON.parse(matched.Steps) : (matched.Steps || matched.steps || []);
    var ings  = typeof matched.Ingredients === "string" ? JSON.parse(matched.Ingredients) : (matched.Ingredients || matched.ingredients || []);
    
    STATE.recipe = {
      prepTime   : matched.PrepTime || matched.prepTime || "—",
      cookTime   : matched.CookTime || matched.cookTime || "—",
      difficulty : matched.Difficulty || matched.difficulty || "Standard",
      ingredients: ings,
      steps      : steps.map(function(s) {
        return {
          title: s.title || s.Title || "Step",
          description: s.description || s.Description || "",
          timerSec: parseInt(s.timerSec || s.TimerSec || 0, 10),
          tip: s.tip || s.Tip || ""
        };
      })
    };
    renderRecipe();
    return;
  }

  var api = getPosApi();
  if (api && api.Recipes && typeof api.Recipes.get === "function") {
    api.Recipes.get(item.dish).then(function(res) {
      if (res && res.data && (res.data.Steps || res.data.steps)) {
        var r = res.data;
        var steps = typeof r.Steps === "string" ? JSON.parse(r.Steps) : (r.Steps || r.steps || []);
        var ings  = typeof r.Ingredients === "string" ? JSON.parse(r.Ingredients) : (r.Ingredients || r.ingredients || []);
        
        STATE.recipe = {
          prepTime   : r.PrepTime || r.prepTime || "—",
          cookTime   : r.CookTime || r.cookTime || "—",
          difficulty : r.Difficulty || r.difficulty || "Standard",
          ingredients: ings,
          steps      : steps.map(function(s) {
            return {
              title: s.title || s.Title || "Step",
              description: s.description || s.Description || "",
              timerSec: parseInt(s.timerSec || s.TimerSec || 0, 10),
              tip: s.tip || s.Tip || ""
            };
          })
        };
      } else {
        STATE.recipe = buildDefaultRecipe(item.dish);
      }
      renderRecipe();
    }).catch(function() {
      STATE.recipe = buildDefaultRecipe(item.dish);
      renderRecipe();
    });
  } else {
    STATE.recipe = buildDefaultRecipe(item.dish);
    renderRecipe();
  }
}

function buildDefaultRecipe(dishName) {
  return {
    prepTime: "5 min",
    cookTime: "10 min",
    difficulty: "Standard",
    ingredients: [{ name: dishName + " base ingredients", amount: "1 portion" }],
    steps: [
      { title: "Mise En Place", description: "Prepare all necessary ingredients and station tools for " + dishName + ".", timerSec: 60, tip: null },
      { title: "Cook & Plate", description: "Cook and plate " + dishName + " according to kitchen standards.", timerSec: 300, tip: "Check seasoning and garnish before serving." }
    ]
  };
}

function playTickChime() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.05, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch(e){}
}

function updateSheetToPreparing() {
  var api = getPosApi();
  if (!api || !api.Orders || !STATE.selected) return;

  var targetOrderId = STATE.selected.orderId;
  var targetItemIdx = STATE.selected.itemIdx;
  var targetDish = STATE.selected.dish;
  var chefName = STATE.currentChef;

  api.Orders.getAll().then(function(res) {
    var orders = (res && res.data) ? res.data : [];
    var order = orders.find(function(r) { return (r.OrderID || r.OrderId || r.orderId || r.id) === targetOrderId; });
    if (!order) return;

    var rawItems = order.Items || order.items || [];
    var itemsArray = safeParseItems(rawItems);
    
    if (itemsArray[targetItemIdx]) {
      itemsArray[targetItemIdx].chef = chefName;
      itemsArray[targetItemIdx].status = "preparing";
    } else {
      for (var i = 0; i < itemsArray.length; i++) {
        var itName = itemsArray[i].name || itemsArray[i].Name || itemsArray[i].dish || "";
        if (itName.trim().toLowerCase() === targetDish.trim().toLowerCase() && (itemsArray[i].status || "").toLowerCase() !== "ready") {
          itemsArray[i].chef = chefName;
          itemsArray[i].status = "preparing";
          break;
        }
      }
    }

    api.Orders.update({
      orderId: targetOrderId,
      status: "preparing",
      items: itemsArray
    });
  });
}

function updateSheetToReady() {
  var api = getPosApi();
  if (!STATE.selected) return Promise.resolve();

  var targetOrderId = STATE.selected.orderId;
  var targetItemIdx = STATE.selected.itemIdx;
  var targetDish = STATE.selected.dish;
  var targetKey = STATE.selected.key;

  STATE.inFlightFinished[targetKey] = true;

  if (!api || !api.Orders || typeof api.Orders.getAll !== "function") {
    return Promise.resolve();
  }

  return api.Orders.getAll().then(function(res) {
    var orders = (res && res.data) ? res.data : [];
    var order = orders.find(function(r) { return (r.OrderID || r.OrderId || r.orderId || r.id) === targetOrderId; });
    if (!order) return;

    var rawItems = order.Items || order.items || [];
    var itemsArray = safeParseItems(rawItems);
    
    if (itemsArray[targetItemIdx]) {
      itemsArray[targetItemIdx].status = "ready";
    } else {
      for (var i = 0; i < itemsArray.length; i++) {
        var itName = itemsArray[i].name || itemsArray[i].Name || itemsArray[i].dish || "";
        if (itName.trim().toLowerCase() === targetDish.trim().toLowerCase() && (itemsArray[i].status || "").toLowerCase() !== "ready") {
          itemsArray[i].status = "ready";
          break;
        }
      }
    }

    var allReady = itemsArray.every(function(it) {
      var st = (it.status || "").toLowerCase();
      var pTime = (it.prepTime || it.PrepTime || "").toLowerCase().trim();
      return st === "ready" || st === "served" || st === "completed" || pTime === "bypass prep";
    });

    return api.Orders.update({
      orderId: targetOrderId,
      status: allReady ? "ready" : "preparing",
      items: itemsArray
    });
  });
}

function startGlobalInterval() {
  if (STATE.globalIntervalId) return;
  STATE.globalIntervalId = setInterval(function() {
    var stateUpdated = false;

    Object.keys(STATE.timers).forEach(function(key) {
      var t = STATE.timers[key];
      if (!t || !t.running) return;

      var r = t.recipeData;
      if (!r || !r.steps || !r.steps[t.currentStepIdx]) return;

      var currentStep = r.steps[t.currentStepIdx];
      if (currentStep.timerSec === 0) return;

      t.remaining--;
      stateUpdated = true;

      if (t.remaining <= 0) {
        var nextIdx = t.currentStepIdx + 1;
        if (nextIdx < r.steps.length) {
          t.currentStepIdx = nextIdx;
          t.remaining = r.steps[nextIdx].timerSec || 0;
          playTickChime();
        } else {
          t.remaining = 0;
          t.running = false;
        }
      }
    });

    if (stateUpdated) {
      renderQueue(); 
      if (STATE.selectedKey && STATE.timers[STATE.selectedKey]) {
        renderRecipe(); 
      }
    }
  }, 1000);
}

function handleStepAdvance() {
  var t = STATE.timers[STATE.selectedKey];
  if (!t || !STATE.recipe) return;
  
  var nextIdx = t.currentStepIdx + 1;
  if (nextIdx < STATE.recipe.steps.length) {
    t.currentStepIdx = nextIdx;
    t.remaining = STATE.recipe.steps[nextIdx].timerSec || 0;
    playTickChime();
  } else {
    t.remaining = 0;
    t.running = false;
  }
  renderRecipe();
}

function toggleAutoCooking() {
  var key = STATE.selectedKey;
  var backgroundTimer = STATE.timers[key];

  if (!backgroundTimer) {
    updateSheetToPreparing();
    STATE.timers[key] = {
      orderId: STATE.selected.orderId,
      dish: STATE.selected.dish,
      currentStepIdx: 0,
      remaining: (STATE.recipe && STATE.recipe.steps[0]) ? (STATE.recipe.steps[0].timerSec || 0) : 0,
      running: true,
      recipeData: STATE.recipe,
      gateState: "focus_cooking"
    };
  } else {
    var currentStep = STATE.recipe.steps[backgroundTimer.currentStepIdx];
    if (currentStep && currentStep.timerSec > 0) {
      backgroundTimer.running = !backgroundTimer.running;
    }
  }
  renderRecipe();
}

function stopCookingTimer() {
  if (STATE.selectedKey) {
    delete STATE.timers[STATE.selectedKey];
  }
  STATE.gateState = "none";
  renderRecipe();
}

function confirmRecipeFinished() {
  var btn = document.querySelector(".bt-controls button");
  if (btn) { btn.disabled = true; btn.textContent = "Finishing..."; }

  updateSheetToReady().then(function() {
    if (STATE.selectedKey) {
      delete STATE.timers[STATE.selectedKey];
    }
    STATE.selected = null;
    STATE.selectedKey = null;
    STATE.recipe = null;
    STATE.gateState = "none";
    
    renderQueue();
    document.getElementById("recipe-panel").innerHTML =
      '<div class="no-selection">' +
        '<div class="ns-icon">👈</div>' +
        '<div class="ns-title">Select a dish from the queue</div>' +
        '<p style="font-size:14px;margin-top:6px">Tap any dish to see step-by-step recipe</p>' +
      '</div>';
    loadQueue();
  }).catch(function(err) {
    console.error("Save error:", err);
    STATE.selected = null;
    STATE.selectedKey = null;
    STATE.recipe = null;
    STATE.gateState = "none";
    renderQueue();
    loadQueue();
  });
}

function calculateTotalTimeRemaining(r, t) {
  if (!r || !t || !r.steps) return 0;
  var total = t.remaining;
  for (var i = t.currentStepIdx + 1; i < r.steps.length; i++) {
    total += r.steps[i].timerSec || 0; 
  }
  return total;
}

function renderRecipe() {
  var panel = document.getElementById("recipe-panel");
  var item  = STATE.selected;
  var r     = STATE.recipe;
  var key   = STATE.selectedKey;

  if (!panel || !item) return;

  if (!r || !r.steps || !r.steps.length) {
    panel.innerHTML =
      '<div class="no-selection">' +
        '<div class="ns-icon">📋</div>' +
        '<div class="ns-title">No recipe found for ' + item.dish + '</div>' +
        '<p style="font-size:13px;margin-top:8px;max-width:360px">This item can be prepared manually.</p>' +
        '<button class="gate-btn" style="margin-top:20px; max-width:260px;" onclick="confirmRecipeFinished()">✅ Mark Dish as Ready</button>' +
      '</div>';
    return;
  }

  var backgroundTimer = STATE.timers[key];
  var localGate = backgroundTimer ? backgroundTimer.gateState : STATE.gateState;
  var qty = item.qty || 1;

  if (localGate === "hygiene") {
    panel.innerHTML =
      '<div class="gate-modal">' +
        '<div class="gate-card">' +
          '<div class="gate-icon">🧼</div>' +
          '<div class="gate-title">Hygiene Check</div>' +
          '<div class="gate-sub">Chef ' + (STATE.currentChef || '') + ', please ensure your hands are washed and sanitized before preparing <strong>' + (qty > 1 ? qty + '× ' : '') + item.dish + '</strong>.</div>' +
          '<button class="gate-btn" onclick="STATE.gateState = \'ingredients\'; renderRecipe();">✅ Yes, I Washed My Hands</button>' +
        '</div>' +
      '</div>';
    return;
  }

  if (localGate === "ingredients") {
    var ingsHtml = (r.ingredients && r.ingredients.length)
      ? r.ingredients.map(function(ing) {
          var scaledAmount = formatIngredientAmount(ing.amount, qty);
          return '<div class="ing-check-item">' +
            '<input type="checkbox" checked style="accent-color:#f39c12; width:16px; height:16px;">' +
            '<div style="flex:1;"><strong>' + ing.name + '</strong></div>' +
            '<div style="color:#f39c12; font-weight:700;">' + scaledAmount + '</div>' +
          '</div>';
        }).join("")
      : '<div style="color:#888; font-size:12px; padding:10px; text-align:center;">No ingredients listed</div>';

    panel.innerHTML =
      '<div class="gate-modal">' +
        '<div class="gate-card">' +
          '<div class="gate-icon">🍳</div>' +
          '<div class="gate-title">Mise En Place Check</div>' +
          (qty > 1 ? '<div class="batch-pill">🔥 BATCH SIZE: ' + qty + ' PORTIONS</div>' : '') +
          '<div class="gate-sub">Confirm scaled ingredients for <strong>' + (qty > 1 ? qty + '× ' : '') + item.dish + '</strong>:</div>' +
          '<div class="ing-check-list">' + ingsHtml + '</div>' +
          '<button class="gate-btn" onclick="toggleAutoCooking();">✅ Yes, Ready to Cook</button>' +
        '</div>' +
      '</div>';
    return;
  }

  if (localGate === "focus_cooking" && backgroundTimer) {
    var stepIdx = backgroundTimer.currentStepIdx;
    var currentStep = r.steps[stepIdx] || r.steps[0];
    var isTimerComplete = !backgroundTimer.running && backgroundTimer.remaining === 0 && (stepIdx >= r.steps.length - 1);
    var isManualStep = (currentStep.timerSec === 0);

    var rem = backgroundTimer.remaining;
    var m   = Math.floor(rem/60);
    var s   = rem % 60;
    var bigTimeDisp = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");

    var totalTimeSec = calculateTotalTimeRemaining(r, backgroundTimer);
    var totM = Math.floor(totalTimeSec/60);
    var totS = totalTimeSec % 60;
    var totalTimeDisp = String(totM).padStart(2,"0") + ":" + String(totS).padStart(2,"0");

    panel.innerHTML =
      '<div class="focused-cooking-box">' +
        '<div class="big-timer-box" style="margin-bottom:16px; background:#111420; display:flex; justify-content:space-between; align-items:center; padding:12px 24px;">' +
          '<div style="text-align:left">' +
            '<div class="bt-label" style="margin-bottom:2px">Interactive Cooking Dashboard</div>' +
            '<div style="font-size:16px; color:#f39c12; font-weight:800;">' + (qty > 1 ? qty + '× ' : '') + item.dish + ' · Table ' + item.table + '</div>' +
            '<div style="font-size:12px; color:#8b949e; margin-top:2px;">⏱ Total Recipe Remaining: <strong>' + totalTimeDisp + '</strong></div>' +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:20px;">' +
            '<div class="bt-display ' + (rem <= 10 && !isManualStep && !isTimerComplete ? 'urgent' : isTimerComplete ? 'done-color' : '') + '" style="font-size:38px; margin:0;">' +
              (isManualStep && !isTimerComplete ? "MANUAL" : isTimerComplete ? "🎉 DONE!" : bigTimeDisp) +
            '</div>' +
            '<div class="bt-controls">' +
              (isManualStep && !isTimerComplete
                ? '<button class="bt-ctrl" style="background:#f39c12; color:black; font-weight:800;" onclick="handleStepAdvance()">➡️ Next Step</button>'
                : !isTimerComplete 
                  ? '<button class="bt-ctrl bt-pause" style="background:' + (backgroundTimer.running ? '#e74c3c' : '#27ae60') + '; color:white;" onclick="toggleAutoCooking()">' + (backgroundTimer.running ? "⏸ Pause" : "▶ Resume") + '</button>'
                  : '<button class="bt-ctrl" style="background:#27ae60; color:white; font-size:14px; padding:10px 20px;" onclick="confirmRecipeFinished()">✅ Confirm Finish</button>'
              ) +
              '<button class="bt-ctrl bt-stop" onclick="stopCookingTimer()">✕ Stop</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="focus-step-card">' +
          '<span class="focus-step-num">Step ' + (stepIdx + 1) + ' of ' + r.steps.length + (isManualStep ? " — Manual" : "") + '</span>' +
          (qty > 1 ? '<div class="batch-pill" style="margin-top:-6px; margin-bottom:14px;">🔥 PREPARING BATCH OF ' + qty + '</div>' : '') +
          '<div class="focus-step-title">' + currentStep.title + '</div>' +
          '<div class="focus-step-desc">' + currentStep.description + '</div>' +
          (currentStep.tip ? '<div class="focus-step-tip">💡 Chef Tip: ' + currentStep.tip + '</div>' : '') +
        '</div>' +
        '<div class="section-lbl">Recipe Steps Timeline</div>' +
        '<div class="timeline-track">' +
          r.steps.map(function(st, i) {
            var isSActive = i === stepIdx;
            var isSDone = i < stepIdx;
            return '<div class="timeline-step ' + (isSActive ? 'active' : isSDone ? 'done' : '') + '">' +
              '<div class="timeline-name">' + (i+1) + '. ' + st.title + '</div>' +
              '<div style="font-size:9px; color:#888;">⏱ ' + (st.timerSec > 0 ? st.timerSec + "s" : "Manual") + '</div>' +
            '</div>';
          }).join("") +
        '</div>' +
      '</div>';
    return;
  }

  var done = STATE.doneSteps.length;
  var total = r.steps.length;

  panel.innerHTML =
    '<div class="recipe-header" style="display:flex; justify-content:space-between; align-items:center;">' +
      '<div>' +
        '<div class="recipe-title">' +
          (qty > 1 ? '<span class="qty-pill" style="font-size:16px; padding:3px 10px;">x' + qty + '</span>' : '') +
          item.dish +
        '</div>' +
        '<div class="recipe-meta">' +
          '<span>⏱ Prep: ' + r.prepTime + '</span>' +
          '<span>🔥 Cook: ' + r.cookTime + '</span>' +
          '<span>⭐ ' + r.difficulty + '</span>' +
          (item.note ? '<span style="color:#f39c12">⚠️ ' + item.note + '</span>' : '') +
          '<span class="' + (done === total && total > 0 ? "meta-ok" : "meta-warn") + '">✅ ' + done + '/' + total + ' steps done</span>' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<button class="gate-btn" style="padding:12px 28px; font-size:14px; width:auto;" onclick="STATE.gateState = \'hygiene\'; renderRecipe();">🔥 START COOKING' + (qty > 1 ? ' (' + qty + 'x)' : '') + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="recipe-content">' +
      '<div class="steps-section">' +
        '<div class="section-lbl">Preparation Steps</div>' +
        r.steps.map(function(step, i) {
          var isDone = STATE.doneSteps.indexOf(i) >= 0;
          var durText = step.timerSec > 0 ? Math.floor(step.timerSec/60) + "m" + (step.timerSec%60 ? " "+step.timerSec%60+"s" : "") : "Manual";
          return '<div class="step-card ' + (isDone ? "s-done" : "") + '">' +
            '<div class="step-header">' +
              '<div class="step-num">' + (isDone ? "✓" : (i+1)) + '</div>' +
              '<div class="step-title-text">' + step.title + '</div>' +
              '<div class="step-dur">⏱ ' + durText + '</div>' +
            '</div>' +
            '<div class="step-desc">' + step.description + '</div>' +
            (step.tip ? '<div class="step-tip">💡 ' + step.tip + '</div>' : '') +
            '<div class="step-actions">' +
              (isDone
                ? '<button class="undo-btn" onclick="undoStep(' + i + ')">↩ Undo</button>'
                : '<button class="done-btn" onclick="markDone(' + i + ')">✓ Done</button>') +
            '</div>' +
          '</div>';
        }).join("") +
      '</div>' +
      '<div class="side-panel">' +
        '<div class="section-lbl">Required Ingredients ' + (qty > 1 ? '(Scaled for ' + qty + ')' : '') + '</div>' +
        (r.ingredients && r.ingredients.length
          ? r.ingredients.map(function(ing){
              var scaled = formatIngredientAmount(ing.amount, qty);
              return '<div class="ing-row"><span class="ing-name">' + ing.name + '</span><span class="ing-amt">' + scaled + '</span></div>';
            }).join("")
          : '<div style="color:#888;font-size:13px;">No ingredients listed.</div>') +
      '</div>' +
    '</div>';
}

function markDone(i) {
  if (STATE.doneSteps.indexOf(i) < 0) STATE.doneSteps.push(i);
  renderRecipe();
}

function undoStep(i) {
  STATE.doneSteps = STATE.doneSteps.filter(function(d){ return d !== i; });
  renderRecipe();
}

// ── AUTH INITIALIZATION ──
(function init() {
  function start() {
    var root = document.getElementById("app");
    if (root) root.style.display = "block";
    var loader = document.getElementById("loading-placeholder");
    if (loader) loader.style.display = "none";

    tickClock();
    setInterval(tickClock, 1000);
    loadChefSelection();

    if (typeof POS_AUTH !== "undefined" && typeof POS_AUTH.renderUtilBar === "function") {
      POS_AUTH.renderUtilBar("user-badge", "kitchen-prep-display");
    }
  }

  if (typeof POS_AUTH !== "undefined") {
    POS_AUTH.init("kitchen-prep-display", {
      onReady: start,
      onError: start
    });
  } else {
    start();
  }
})();
</script>
</body>
</html>
