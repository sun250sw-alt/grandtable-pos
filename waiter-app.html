                            itemsArray = typeof raw === "string" ? JSON.parse(raw) : raw; 
                        } catch(e){}
                        
                        itemsArray = itemsArray.map(it => {
                            if ((it.name || it.Name) === itemName) {
                                it.status = "ready";
                                it.chef = currentServer + " (Staff)";
                            }
                            return it;
                        });

                        const allReady = itemsArray.every(it => {
                            return it.status === "ready" || it.prepTime === "Bypass Prep";
                        });

                        if (api.Orders && typeof api.Orders.update === "function") {
                            await api.Orders.update({
                                orderId: orderId,
                                status: allReady ? "ready" : "preparing",
                                items: itemsArray
                            });
                        }
                        
                        showNotification(`Collected ${itemName}!`);
                        loadData();
                    }
                } catch(e) {
                    showNotification("Failed to collect: " + e.message, "error");
                }
            };

            // ── TILL: TAKEAWAY / QUICK POS SALE ──
            const handleTillQuickCheckout = async () => {
                if (orderItems.length === 0) {
                    showNotification("Add items to till cart first!", "error");
                    return;
                }

                const api = getPosApi();
                if (!api) return;

                const subtotal = calculateTotal();
                const tax = parseFloat((subtotal * taxRate).toFixed(2));
                const total = parseFloat((subtotal + tax).toFixed(2));
                const tendered = paymentMethod === "Cash" ? (parseFloat(tillCashTendered) || total) : total;
                const change = Math.max(0, tendered - total);

                try {
                    const generatedId = "ORD-" + Date.now().toString().slice(-6);
                    const newOrder = {
                        orderId     : generatedId,
                        tableNumber : 0,
                        waiterName  : currentServer + " (Till)",
                        items       : orderItems.map(i => ({ 
                            name: i.name, 
                            qty: i.quantity, 
                            price: i.price,
                            category: i.category,
                            prepTime: i.prepTime
                        })).concat(dealCalc.dealLines || []),
                        subtotal    : subtotal,
                        tax         : tax,
                        total       : total,
                        status      : "preparing",
                        notes       : `[TAKEAWAY - PAID ${paymentMethod}]`,
                        memberId    : member ? member.MemberID : ""
                    };

                    let realId = generatedId;
                    if (api.Orders && typeof api.Orders.create === "function") {
                        const created = await api.Orders.create(newOrder);
                        if (created && created.data && created.data.orderId) realId = created.data.orderId;   // the saved ID, so the receipt matches the lobby screen
                    }
                    newOrder.orderId = realId;

                    setCompletedPaymentModal({
                        orderId: realId,
                        table: "Takeaway",
                        total,
                        tendered,
                        change,
                        method: paymentMethod,
                        rawOrder: newOrder
                    });

                    printReceipt(newOrder, { method: paymentMethod, tendered, change }, currency, taxRate);

                    setOrderItems([]);
                    setMember(null);
                    setTillCashTendered("");
                    loadData();
                } catch(e) {
                    showNotification("Checkout failed: " + e.message, "error");
                }
            };

            // ── HAND OVER COMPLETED TAKEAWAY TO CUSTOMER ──
            const handleHandoverTakeaway = async (order) => {
                const api = getPosApi();
                if (!api) return;

                try {
                    if (api.Orders && typeof api.Orders.update === "function") {
                        await api.Orders.update({
                            orderId: order.OrderID || order.orderId,
                            status: "closed"
                        });
                    }

                    showNotification(`Order #${order.OrderID || order.orderId} handed over to customer!`);
                    setSelectedTakeawayOrder(null);
                    loadData();
                } catch(e) {
                    showNotification("Handover failed: " + e.message, "error");
                }
            };

            // ── TILL: SETTLE BILL (FOR TABLE OR UNPAID TAKEAWAY) ──
            const handleSettleOrderBill = async (order) => {
                const api = getPosApi();
                if (!api) return;

                const subtotal = parseFloat(order.Subtotal || order.subtotal || 0);
                const tax = parseFloat(order.Tax || order.tax || (subtotal * taxRate));
                const total = parseFloat(order.Total || order.total || (subtotal + tax));
                const tendered = paymentMethod === "Cash" ? (parseFloat(tillCashTendered) || total) : total;
                const change = Math.max(0, tendered - total);

                try {
                    if (api.Orders && typeof api.Orders.update === "function") {
                        await api.Orders.update({
                            orderId: order.OrderID || order.orderId,
                            status: "closed",
                            notes: ((order.Notes || order.notes) ? (order.Notes || order.notes) + " " : "") + `[PAID ${paymentMethod} at Till]`,   // keep delivery address etc.
                            ...(member && !order.MemberID ? { memberId: member.MemberID } : {})
                        });
                    }

                    if (api.Tables && typeof api.Tables.update === "function" && selectedTable) {
                        await api.Tables.update({
                            tableNumber: selectedTable.number,
                            status: "available",
                            currentWaiter: "",
                            guests: 0
                        });
                    }

                    const label = parseInt(order.TableNumber) > 0 ? `Table ${order.TableNumber}` : (order.CustomerName ? `${order.CustomerName} (Takeaway)` : 'Takeaway');

                    setCompletedPaymentModal({
                        orderId: order.OrderID || order.orderId,
                        table: label,
                        total,
                        tendered,
                        change,
                        method: paymentMethod,
                        rawOrder: order
                    });

                    printReceipt(order, { method: paymentMethod, tendered, change }, currency, taxRate);

                    setSelectedTable(null);
                    setSelectedTakeawayOrder(null);
                    setTillCashTendered("");
                    loadData();
                } catch(e) {
                    showNotification("Failed to settle bill: " + e.message, "error");
                }
            };

            // Active Takeaway Orders (counter sales, Table 0) — online orders have their own tab
            const isOnlineOrder = (o) => !!(window.POS_ORDER && POS_ORDER.isOnline(o));
            const activeTakeawayOrders = liveOrders.filter(o => {
                const tbl = parseInt(o.TableNumber || o.table || 0);
                const st = (o.Status || o.status || "").toLowerCase();
                return (tbl === 0 || tbl >= 90) && !isOnlineOrder(o) && !["closed", "cancelled", "void"].includes(st);
            });
            // Active ONLINE orders (Customer App: delivery + pickup)
            const activeOnlineOrders = liveOrders.filter(o => {
                const st = (o.Status || o.status || "").toLowerCase();
                return isOnlineOrder(o) && !["closed", "cancelled", "void"].includes(st);
            });
            const newOnlineCount = activeOnlineOrders.filter(o => (o.Status || "").toLowerCase() === "new").length;
            const listOrders = leftSidebarTab === 'online' ? activeOnlineOrders : activeTakeawayOrders;

            // Ping when a brand-new online order arrives
            const seenOnlineRef = React.useRef(null);
            useEffect(() => {
                const ids = new Set(activeOnlineOrders.map(o => o.OrderID));
                if (seenOnlineRef.current) {
                    const fresh = [...ids].filter(id => !seenOnlineRef.current.has(id));
                    if (fresh.length) {
                        showNotification("🌐 New online order: " + fresh.join(", "));
                        try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(); o.connect(a.destination); o.frequency.value = 880; o.start(); setTimeout(() => o.stop(), 250); } catch (e) {}
                    }
                }
                seenOnlineRef.current = ids;
            }, [liveOrders]);

            // Currently focused active order
            const activeOrderInFocus = selectedTable 
                ? liveOrders.find(o => 
                    parseInt(o.TableNumber || o.table) === parseInt(selectedTable.number) && 
                    !["closed", "cancelled", "void"].includes((o.Status || o.status || "").toLowerCase())
                  )
                : selectedTakeawayOrder 
                    ? liveOrders.find(o => (o.OrderID || o.orderId) === (selectedTakeawayOrder.OrderID || selectedTakeawayOrder.orderId) && !["closed", "cancelled", "void"].includes((o.Status || o.status || "").toLowerCase())) || selectedTakeawayOrder
                    : null;

            // ── LOYALTY: scan / look up a member and attach them to the sale ──
            const [scanning, setScanning] = useState(false);
            const focusMemberId = activeOrderInFocus && (activeOrderInFocus.MemberID || "");
            useEffect(() => {
                if (!window.POS_IS_LAN || !focusMemberId) return;
                if (member && member.MemberID === focusMemberId) return;
                window.POS_MEMBERS.lookup(focusMemberId).then(setMember).catch(() => {});
            }, [focusMemberId]);
            const openMemberScan = () => {
                window.POS_SCAN.open({
                    title: "Scan loyalty QR",
                    onResult: async (text) => {
                        const m = await window.POS_MEMBERS.lookup(text);
                        setMember(m);
                        const api = getPosApi();
                        if (activeOrderInFocus && api && api.Orders && api.Orders.update) {
                            await api.Orders.update({ orderId: activeOrderInFocus.OrderID || activeOrderInFocus.orderId, memberId: m.MemberID });
                        }
                        showNotification("✅ Member scan successful " + (m.Code || ""));
                    }
                });
            };
            const memberBar = window.POS_IS_LAN ? (
                <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8, margin: "0 0 10px", padding: "8px 10px", background: member ? "#e8f5e9" : "#f5f5f5", borderRadius: 10, fontSize: 13, color: "#1e293b" }}>
                    <span style={{ flex: "1 1 140px", minWidth: 0 }}>{member ? <span>✅ <b>Member verified</b> · {member.Code || "#" + String(member.MemberID || "").slice(-4)} · ⭐ {member.Points || 0} pts
                        {Object.values(memberCtx.rewards || {}).map(r => <span key={r.dealId} style={{ display: "inline-block", marginLeft: 8, padding: "2px 8px", borderRadius: 10, fontSize: 11, fontWeight: 700, background: r.available > 0 ? "#fef3c7" : "#eef2ff", color: r.available > 0 ? "#92400e" : "#4338ca" }}>{r.type === "stamp" ? (r.available > 0 ? "🎁 FREE " + r.free + " ready (" + r.available + ")" : "🎫 " + r.name + " " + r.progress + "/" + r.need) : (r.available > 0 ? "🎁 Welcome gift: free " + r.free : "")}</span>)}
                    </span> : "No loyalty member on this sale"}</span>
                    <button className="btn btn-ghost" style={{ padding: "6px 10px" }} onClick={openMemberScan}>📷 {member ? "Change" : "Scan member"}</button>
                    {member && !focusMemberId ? <button className="btn btn-ghost" style={{ padding: "6px 10px" }} onClick={() => setMember(null)}>✕</button> : null}
                </div>
            ) : null;

            // ── SERVER SELECTION SCREEN ──
            if (!currentServer) {
                const renderList = staff.map(s => s.Name || s.StaffName || s.name).filter(Boolean);

                return (
                    <div className="app-container">
                        <div className="header">
                            <h1>🍽️ {posShopName} POS</h1>
                        </div>
                        <div className="server-screen">
                            <div style={{ fontSize: "56px" }}>🧑‍💼</div>
                            <h2 style={{ fontSize: "24px", fontWeight: "800", marginTop: "12px" }}>Select Staff Profile</h2>
                            <p style={{ color: "#666", marginTop: "4px" }}>Choose your name to access floor ordering and till payment terminal</p>
                            
                            {loading ? (
                                <div style={{ color: "#888", marginTop: "30px" }}>Loading staff profiles...</div>
                            ) : renderList.length === 0 ? (
                                <div style={{ color: "#8b949e", marginTop: "30px", background: "#f8fafc", padding: "20px", borderRadius: "10px", border: "1px solid #e2e8f0" }}>
                                    <div>No active staff profiles found in Google Sheets database.</div>
                                    <div style={{ fontSize: "12px", color: "#f59e0b", marginTop: "4px" }}>Add team members in the Staff sheet tab.</div>
                                </div>
                            ) : (
                                <div className="server-grid">
                                    {renderList.map((name, i) => (
                                        <div key={i} className="server-card" onClick={() => setCurrentServer(name)}>
                                            <div className="server-avatar">{name.charAt(0).toUpperCase()}</div>
                                            <div className="server-name">{name}</div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // ── MAIN TERMINAL VIEW ──
            return (
                <div className="app-container">
                    <div className="header">
                        <h1>🍽️ {posShopName}</h1>
                        
                        {/* MODE SWITCHER */}
                        <div className="mode-switcher">
                            <button 
                                className={`mode-tab ${activeAppMode === 'waiter' ? 'active' : ''}`}
                                onClick={() => { setActiveAppMode('waiter'); setOrderItems([]); }}
                            >
                                🧑‍💼 Waiter Floor
                            </button>
                            <button 
                                className={`mode-tab ${activeAppMode === 'till' ? 'active' : ''}`}
                                onClick={() => { setActiveAppMode('till'); setOrderItems([]); }}
                            >
                                💳 Till & Reception
                            </button>
                        </div>

                        <div className="header-info">
                            <button className="btn btn-ghost" disabled={deliveryBusy} title="Let online customers request delivery" style={{ padding: '6px 12px', fontSize: '11px', color: 'white', background: deliveryOn ? 'rgba(39,174,96,0.85)' : 'rgba(192,57,43,0.85)', border: '1px solid rgba(255,255,255,0.35)', fontWeight: 700 }} onClick={toggleDelivery}>
                                🛵 Delivery: {deliveryOn ? 'ON' : 'OFF'}
                            </button>
                            {activeAppMode === 'till' && (
                                <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: '11px', color: 'white', background: liveOrders.some(isAwaitingDriverCash) ? 'rgba(124,58,237,0.95)' : 'rgba(255,255,255,0.15)', border: '1px solid rgba(255,255,255,0.35)', fontWeight: 700 }} onClick={() => setShowDriverCash(true)}>
                                    💵 Driver cash{liveOrders.filter(isAwaitingDriverCash).length ? ` (${liveOrders.filter(isAwaitingDriverCash).length})` : ''}
                                </button>
                            )}
                            {activeAppMode === 'till' && (
                                <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: '11px', color: 'white', background: 'rgba(243,156,18,0.9)', border: '1px solid rgba(255,255,255,0.35)', fontWeight: 700 }} onClick={() => setShowZRead(true)}>
                                    🧾 Z-Read
                                </button>
                            )}
                            <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: '11px', color: 'white', background: 'rgba(255,255,255,0.15)', border: '1px solid rgba(255,255,255,0.25)' }} onClick={() => setShowHistoryModal(true)}>
                                📋 History
                            </button>
                            <button className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: '11px', color: 'white', background: 'rgba(255,255,255,0.15)', border: '1px solid rgba(255,255,255,0.25)' }} onClick={() => { setCurrentServer(null); setSelectedTable(null); setSelectedTakeawayOrder(null); setOrderItems([]); }}>
                                ↩ Switch Staff
                            </button>
                            <div>Staff: <strong>{currentServer}</strong></div>
                        </div>
                    </div>

                    <div className="main-layout">
                        {/* ── COLUMN 1: LEFT SIDEBAR (2-COLUMN TABLE GRID / TAKEAWAYS) ── */}
                        <div className="panel">
                            <h2>
                                <span>{leftSidebarTab === 'tables' ? '🪑 Floor Tables' : leftSidebarTab === 'online' ? '🌐 Online Orders' : '🥡 Takeaways'}</span>
                                {activeAppMode === 'till' && (
                                    <button 
                                        className={`btn ${(!selectedTable && !selectedTakeawayOrder) ? 'btn-primary' : 'btn-ghost'}`} 
                                        style={{ width: 'auto', padding: '4px 10px', fontSize: '11px' }}
                                        onClick={() => { setSelectedTable(null); setSelectedTakeawayOrder(null); setOrderItems([]); }}
                                    >
                                        + New Sale
                                    </button>
                                )}
                            </h2>

                            {/* Left View Switcher Tabs */}
                            <div className="left-tab-bar">
                                <button 
                                    className={`lt-btn ${leftSidebarTab === 'tables' ? 'active' : ''}`}
                                    onClick={() => setLeftSidebarTab('tables')}
                                >
                                    🪑 Tables ({tables.length})
                                </button>
                                <button 
                                    className={`lt-btn ${leftSidebarTab === 'takeaway' ? 'active' : ''}`}
                                    onClick={() => setLeftSidebarTab('takeaway')}
                                >
                                    🥡 Takeaways ({activeTakeawayOrders.length})
                                </button>
                                <button 
                                    className={`lt-btn online-tab ${leftSidebarTab === 'online' ? 'active' : ''} ${newOnlineCount > 0 && leftSidebarTab !== 'online' ? 'has-new' : ''}`}
                                    onClick={() => setLeftSidebarTab('online')}
                                >
                                    🌐 Online ({activeOnlineOrders.length})
                                </button>
                            </div>

                            {/* 2-COLUMN TABLES GRID TILES */}
                            {leftSidebarTab === 'tables' ? (
                                tables.length === 0 ? (
                                    <div style={{ textAlign: 'center', padding: '30px 10px', color: '#888' }}>No tables configured</div>
                                ) : (
                                    <div className="tables-grid">
                                        {tables.map(table => {
                                            const matchOrder = liveOrders.find(o => parseInt(o.TableNumber || o.table) === parseInt(table.number) && !["closed", "cancelled", "void"].includes((o.Status || o.status || "").toLowerCase()));
                                            const isFoodReady = matchOrder && (matchOrder.Status || matchOrder.status || "").toLowerCase() === "ready";
                                            
                                            let statusClass = "available";
                                            const ordStatus = (matchOrder ? (matchOrder.Status || matchOrder.status || "") : "").toLowerCase();

                                            if (table.status === "occupied" || ["new", "preparing"].includes(ordStatus)) {
                                                statusClass = "occupied";
                                            } else if (table.status === "delivered" || ordStatus === "served") {
                                                statusClass = "delivered";
                                            } else if (table.status === "paid") {
                                                statusClass = "paid";
                                            }

                                            return (
                                                <div
                                                    key={table.id}
                                                    className={`table-card ${statusClass} ${selectedTable?.id === table.id ? 'selected' : ''}`}
                                                    onClick={() => handleTableSelect(table)}
                                                >
                                                    {isFoodReady && <div className="ready-badge">🔔 Ready</div>}
                                                    <div className="table-number">Table {table.number}</div>
                                                    <div className="table-status">
                                                        <span className={`badge badge-${statusClass}`}>{statusClass}</span>
                                                    </div>
                                                    {matchOrder ? (
                                                        <div className="table-amount">{currency} {parseFloat(matchOrder.Total || matchOrder.total || 0).toFixed(2)}</div>
                                                    ) : (
                                                        <div style={{ fontSize: '11px', color: '#94a3b8', marginTop: '4px' }}>{table.capacity} seats</div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )
                            ) : (
                                /* ACTIVE TAKEAWAY / ONLINE ORDERS LIST */
                                listOrders.length === 0 ? (
                                    <div style={{ textAlign: 'center', padding: '30px 10px', color: '#94a3b8' }}>
                                        <div style={{ fontSize: '28px', marginBottom: '4px' }}>{leftSidebarTab === 'online' ? '🌐' : '🥡'}</div>
                                        <div style={{ fontWeight: 700, fontSize: '13px' }}>{leftSidebarTab === 'online' ? 'No active online orders' : 'No active takeaway orders'}</div>
                                        <div style={{ fontSize: '11px', color: '#64748b', marginTop: '2px' }}>{leftSidebarTab === 'online' ? 'Customer App orders appear here instantly' : 'Tap "+ New Sale" to start a takeaway order'}</div>
                                    </div>
                                ) : (
                                    <div className="takeaway-list">
                                        {listOrders.map((order, idx) => {
                                            const st = (order.Status || "new").toLowerCase();
                                            const isSelected = selectedTakeawayOrder && (selectedTakeawayOrder.OrderID || selectedTakeawayOrder.orderId) === (order.OrderID || order.orderId);
                                            const isReady = st === "ready";
                                            let itemsCount = 0;
                                            try {
                                                const its = JSON.parse(order.Items);
                                                itemsCount = its.reduce((acc, it) => acc + parseInt(it.qty || it.quantity || 1), 0);
                                            } catch(e){}

                                            return (
                                                <div 
                                                    key={idx}
                                                    className={`takeaway-card ${isSelected ? 'selected' : ''} ${isOnlineOrder(order) ? 'online' : ''}`}
                                                    onClick={() => handleTakeawaySelect(order)}
                                                >
                                                    {isReady && <div className="ready-badge">🔔 Ready</div>}
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                        <strong style={{ fontSize: '13px' }}>#{order.OrderID || order.orderId}</strong>
                                                        <span className={`badge ${isReady ? 'badge-available' : 'badge-occupied'}`}>
                                                            {isReady ? '✅ Ready' : st === 'preparing' ? '🔥 Cooking' : '⏳ Queued'}
                                                        </span>
                                                    </div>
                                                    <div style={{ fontSize: '12px', color: '#475569', marginTop: '3px' }}>
                                                        {isOnlineOrder(order) && <span className="online-chip" style={{ marginRight: '6px' }}>{POS_ORDER.label(order)}</span>}
                                                        {order.CustomerName ? `👤 ${order.CustomerName}` : '🥡 Takeaway / Counter'}
                                                    </div>
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '6px', fontSize: '12px', fontWeight: 800 }}>
                                                        <span style={{ color: '#64748b' }}>{itemsCount} items</span>
                                                        <span style={{ color: '#1e1b4b' }}>{currency} {parseFloat(order.Total || order.total || 0).toFixed(2)}</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )
                            )}
                        </div>

                        {/* ── COLUMN 2: MENU DIRECTORY ── */}
                        <div className="panel">
                            <h2>Menu Directory</h2>
                            
                            <input
                                type="text"
                                className="search-box"
                                placeholder="🔍 Search menu items..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                            />

                            <div className="menu-categories">
                                {categories.map(cat => (
                                    <button
                                        key={cat}
                                        className={`category-btn ${selectedCategory === cat ? 'active' : ''}`}
                                        onClick={() => setSelectedCategory(cat)}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>

                            {filteredMenu.length === 0 ? (
                                <div style={{ textAlign: 'center', padding: '40px 10px', color: '#888' }}>
                                    <div>No menu items found</div>
                                </div>
                            ) : (
                                <div className="menu-items-grid">
                                    {filteredMenu.map(item => (
                                        <div
                                            key={item.id}
                                            className="menu-card-item"
                                            onClick={() => addToOrder(item)}
                                        >
                                            <div>
                                                <div style={{ fontSize: '22px', marginBottom: '4px' }}>{item.emoji || '🍽️'}</div>
                                                <div className="mci-name">{item.name}</div>
                                            </div>
                                            <div className="mci-price">{currency} {item.price.toFixed(2)}</div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* ── COLUMN 3: ORDER DETAILS, LIVE DISH STATUS & BILLING ── */}
                        <div className="panel">
                            <h2>
                                <span>{activeAppMode === 'till' ? '💳 Till Payment & Bill' : 'Current Order'}</span>
                                {selectedTable ? (
                                    <span className="badge badge-occupied">Table {selectedTable.number}</span>
                                ) : selectedTakeawayOrder ? (
                                    <span className="badge badge-available">{isOnlineOrder(selectedTakeawayOrder) ? 'Online' : 'Takeaway'} #{selectedTakeawayOrder.OrderID || selectedTakeawayOrder.orderId}</span>
                                ) : (
                                    <span className="badge badge-available">New Counter Sale</span>
                                )}
                            </h2>

                            <div className="order-panel-body">
                                {(selectedTable || selectedTakeawayOrder || activeAppMode === 'till') ? memberBar : null}
                                {!selectedTable && !selectedTakeawayOrder && activeAppMode !== 'till' ? (
                                    <div style={{ textAlign: 'center', padding: '40px 10px', color: '#94a3b8' }}>
                                        <div style={{ fontSize: '40px', marginBottom: '8px' }}>🍽️</div>
                                        <div style={{ fontWeight: 700, fontSize: '15px', color: '#1e293b' }}>Select a Table to start</div>
                                        <div style={{ fontSize: '12px', marginTop: '4px' }}>Choose a table or takeaway order on the left</div>
                                    </div>
                                ) : activeOrderInFocus ? (
                                    /* ── ACTIVE ORDER: FULL DISHES & KITCHEN STATUS BREAKDOWN ── */
                                    (() => {
                                        let parsedItems = [];
                                        try {
                                            const raw = activeOrderInFocus.Items || activeOrderInFocus.items || [];
                                            parsedItems = typeof raw === "string" ? JSON.parse(raw) : raw;
                                        } catch(e){}

                                        const sub = parseFloat(activeOrderInFocus.Subtotal || activeOrderInFocus.subtotal || 0);
                                        const tx = parseFloat(activeOrderInFocus.Tax || activeOrderInFocus.tax || (sub * taxRate));
                                        const tot = parseFloat(activeOrderInFocus.Total || activeOrderInFocus.total || (sub + tx));
                                        const tendered = paymentMethod === "Cash" ? (parseFloat(tillCashTendered) || 0) : tot;
                                        const change = Math.max(0, tendered - tot);

                                        const ordStatus = (activeOrderInFocus.Status || "").toLowerCase();
                                        const isTakeaway = parseInt(activeOrderInFocus.TableNumber || 0) === 0 || parseInt(activeOrderInFocus.TableNumber || 0) >= 90;
                                        const onlineFocus = isOnlineOrder(activeOrderInFocus);
                                        const labelText = onlineFocus ? `${POS_ORDER.label(activeOrderInFocus)} · ${activeOrderInFocus.CustomerName || 'Customer'}` : isTakeaway ? (activeOrderInFocus.CustomerName ? `${activeOrderInFocus.CustomerName} (Takeaway)` : 'Takeaway Order') : `Table ${activeOrderInFocus.TableNumber}`;
                                        
                                        const isAlreadyPaid = (activeOrderInFocus.Notes || "").includes("PAID") || ["closed", "paid"].includes(ordStatus);
                                        const onlineUnpaid = onlineFocus && !isAlreadyPaid;
                                        const onlineType = onlineFocus ? POS_ORDER.type(activeOrderInFocus) : null;

                                        return (
                                            <div>
                                                {/* Status Progress Header Card */}
                                                <div className="progress-box">
                                                    <div className="progress-header">
                                                        <div>
                                                            <strong style={{ fontSize: '13px' }}>{activeOrderInFocus.OrderID}</strong>
                                                            <div style={{ fontSize: '11px', color: '#64748b', marginTop: '1px' }}>
                                                                {labelText} · Server: {activeOrderInFocus.WaiterName || 'Staff'}
                                                            </div>
                                                        </div>
                                                        <div style={{ textAlign: 'right' }}>
                                                            {ordStatus !== "served" && <OrderTimer orderTime={activeOrderInFocus.OrderTime || activeOrderInFocus.orderTime} />}
                                                            <div style={{ marginTop: '3px' }}>
                                                                <span className={`progress-status ${
                                                                    ordStatus === 'ready' ? 'status-ready' : 
                                                                    ordStatus === 'preparing' ? 'status-cooking' : 
                                                                    ordStatus === 'served' ? 'status-delivered' : 'status-queue'
                                                                }`}>
                                                                    {ordStatus === 'ready' ? 'Ready' : 
                                                                     ordStatus === 'preparing' ? 'Cooking' : 
                                                                     ordStatus === 'served' ? 'Served' : 'In Queue'}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {onlineFocus && (
                                                        <div className="online-info">
                                                            {POS_ORDER.phone(activeOrderInFocus) && <div>📞 <a href={`tel:${POS_ORDER.phone(activeOrderInFocus)}`}>{POS_ORDER.phone(activeOrderInFocus)}</a></div>}
                                                            {POS_ORDER.type(activeOrderInFocus) === 'delivery' && (

                                                                </div>

                                                            const isCollected = item.status === "ready";
                                                            
                                                            let itemStatusText = "⏳ Queued";
                                                            let statusColor = "#4f46e5";
                                                            let actionButtonHtml = null;

                                                            if (ordStatus === 'served') {
                                                                itemStatusText = "✓ Delivered";
                                                                statusColor = "#7e22ce";
                                                            } else if (isBypassed) {
                                                                if (isCollected) {
                                                                    itemStatusText = "📥 Collected";
                                                                    statusColor = "#10b981";
                                                                } else {
                                                                    itemStatusText = "⏳ Ready to Collect";
                                                                    statusColor = "#f59e0b";

                                                                            className="btn btn-primary" 
                                                                            style={{ padding: '3px 8px', fontSize: '10px', width: 'auto', marginTop: '2px' }} 
                                                                            onClick={() => handleCollectBypassedItem(activeOrderInFocus.OrderID, item.name || item.Name)}
                                                                        >
                                                                            📥 Collect
                                                                        </button>
                                                                    );
                                                                }
                                                            } else if (item.status === "ready") {
                                                                itemStatusText = "✅ Ready";
                                                                statusColor = "#10b981";
                                                            } else if (item.status === "preparing" || item.chef) {
                                                                itemStatusText = `👨‍🍳 Cook (${item.chef || "Chef"})`;
                                                                statusColor = "#d97706";
                                                            }

                                                            // Cancel is offered only until the kitchen starts the item (or it's collected/paid/served)
                                                            const canCancel = ordStatus !== 'served' && !isAlreadyPaid && !item.chef
                                                                && !["preparing", "ready", "served", "cancelled"].includes(String(item.status || "").toLowerCase());

                                                            return (
                                                                <div key={idx} className="dish-row">
                                                                    <div className="dish-row-top">
                                                                        <span>{item.qty || item.quantity}× {item.name || item.Name}</span>
                                                                        <span style={{ fontWeight: 800, fontSize: '11px', color: statusColor }}>{itemStatusText}</span>
                                                                    </div>
                                                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '2px' }}>
                                                                        <span style={{ fontSize: '11px', color: '#94a3b8' }}>
                                                                            {currency} {(parseFloat(item.price || 0) * parseInt(item.qty || 1)).toFixed(2)}
                                                                        </span>
                                                                        <span style={{ display: 'inline-flex', gap: '6px', alignItems: 'center' }}>

                                                                                    style={{ padding: '3px 8px', fontSize: '10px', width: 'auto', marginTop: '2px' }}
                                                                                    onClick={() => handleCancelItem(activeOrderInFocus.OrderID, idx, item.name || item.Name)}
                                                                                >
                                                                                    ✕ Cancel
                                                                                </button>
                                                                            )}
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}

                                                                        <div className="oir-name">{item.name}</div>
                                                                        <div className="oir-price">{currency} {item.price.toFixed(2)} × {item.quantity} = {currency} {(item.price * item.quantity).toFixed(2)}</div>

                                                                        <button className="qty-btn" onClick={() => updateQuantity(item.id, 1)}>+</button>
                                                                    </div>
                                                                </div>

                                                            <span>Add-ons Subtotal:</span>
                                                            <span>{currency} {calculateTotal().toFixed(2)}</span>
                                                        </div>

                                                            <button 
                                                                className="btn btn-primary" 
                                                                onClick={() => triggerAddOnConfirmation(activeOrderInFocus.OrderID, labelText)}

                                                                📤 Send Add-on to Kitchen
                                                            </button>
                                                            <button className="btn btn-danger" style={{ padding: '7px' }} onClick={() => setOrderItems([])}>
                                                                🗑️ Clear Add-ons
                                                            </button>
                                                        </div>

                                                        <div className="totals-summary" style={{ marginTop: 0 }}>

                                                            <div className="totals-row"><span>Tax ({(taxRate * 100).toFixed(0)}%):</span><span>{currency} {tx.toFixed(2)}</span></div>
                                                            <div className="totals-row grand-total"><span>Active Total:</span><span>{currency} {tot.toFixed(2)}</span></div>
                                                        </div>

                                                                    </React.Fragment>

                                                            </div>

                                                                    className="btn btn-ghost" 
                                                                    onClick={() => printReceipt(activeOrderInFocus, { method: "PAID" }, currency, taxRate)}
                                                                >
                                                                    🖨️ Print Slip
                                                                </button>
                                                            </div>

                                                                            <button className="tender-btn" onClick={() => setTillCashTendered((Math.ceil(tot / 1000) * 1000).toString())}>+1000</button>

                                                                                    {k}
                                                                                </button>
                                                                            ))}
                                                                        </div>
                                                                        <button className="num-btn num-btn-action" style={{ width: '100%', marginTop: '5px', padding: '5px' }} onClick={() => handleKeypadPress("C")}>
                                                                            Clear (C)
                                                                        </button>

                                                                        <div className="change-banner">
                                                                            <span>Change Due:</span>
                                                                            <span style={{ fontSize: '15px' }}>{currency} {change.toFixed(2)}</span>
                                                                        </div>
                                                                    </div>
                                                                )}

                                                                <div className="action-stack">
                                                                    <button className="btn btn-success" onClick={() => handleSettleOrderBill(activeOrderInFocus)}>
                                                                        ✅ Settle Bill & Print Receipt
                                                                    </button>
                                                                    <button className="btn btn-ghost" onClick={() => printReceipt(activeOrderInFocus, { method: paymentMethod }, currency, taxRate)}>
                                                                        🖨️ Print Bill Only
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            /* WAITER FLOOR DELIVER ACTION */
                                                            <div className="action-stack">
                                                                {ordStatus === "ready" && (
                                                                    <button className="btn btn-success" onClick={() => handleDeliverOrder(activeOrderInFocus.OrderID)}>
                                                                        🚀 Deliver Order to Table
                                                                    </button>
                                                                )}
                                                                <button className="btn btn-ghost" onClick={() => { setSelectedTable(null); setSelectedTakeawayOrder(null); }}>
                                                                    ← Back to Tables
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })()
                                ) : orderItems.length === 0 ? (

                                    <div style={{ textAlign: 'center', padding: '30px 10px', color: '#94a3b8' }}>

                                        <div style={{ fontWeight: 700, fontSize: '14px', color: '#1e293b' }}>
                                            {selectedTable ? `Table ${selectedTable.number} is Empty` : 'Takeaway Cart is Empty'}
                                        </div>
                                        <div style={{ fontSize: '11px', marginTop: '4px' }}>Click items from menu to start order</div>
                                    </div>

                                    <div>
                                        <div className="order-items-list" style={{ maxHeight: '160px' }}>

                                                        <div className="oir-name">{item.name}</div>
                                                        <div className="oir-price">{currency} {item.price.toFixed(2)} × {item.quantity} = {currency} {(item.price * item.quantity).toFixed(2)}</div>
                                                    </div>
                                                    <div className="oir-controls">
                                                        <button className="qty-btn" onClick={() => updateQuantity(item.id, -1)}>−</button>
                                                        <span style={{ fontWeight: 800, minWidth: '18px', textAlign: 'center', fontSize: '13px' }}>{item.quantity}</span>
                                                        <button className="qty-btn" onClick={() => updateQuantity(item.id, 1)}>+</button>
                                                    </div>
                                                </div>
                                            ))}
                                            {dealRows}
                                        </div>

                                        <div className="totals-summary">
                                            <div className="totals-row"><span>Subtotal:</span><span>{currency} {calculateTotal().toFixed(2)}</span></div>
                                            <div className="totals-row"><span>Tax ({(taxRate * 100).toFixed(0)}%):</span><span>{currency} {(calculateTotal() * taxRate).toFixed(2)}</span></div>
                                            <div className="totals-row grand-total"><span>Total:</span><span>{currency} {(calculateTotal() * (1 + taxRate)).toFixed(2)}</span></div>
                                        </div>

                                        {activeAppMode === 'till' ? (
                                            /* TILL TAKEAWAY PAYMENT */
                                            (() => {
                                                const tot = calculateTotal() * (1 + taxRate);
                                                const tendered = paymentMethod === "Cash" ? (parseFloat(tillCashTendered) || 0) : tot;
                                                const change = Math.max(0, tendered - tot);

                                                return (
                                                    <div>
                                                        <div className="payment-box">
                                                            <div style={{ display: 'flex', gap: '6px', marginBottom: '8px' }}>
                                                                <button className={`btn ${paymentMethod === 'Cash' ? 'btn-primary' : 'btn-ghost'}`} style={{ padding: '6px', fontSize: '11px' }} onClick={() => setPaymentMethod('Cash')}>💵 Cash</button>
                                                                <button className={`btn ${paymentMethod === 'Card' ? 'btn-primary' : 'btn-ghost'}`} style={{ padding: '6px', fontSize: '11px' }} onClick={() => setPaymentMethod('Card')}>💳 Card</button>

                                                            {paymentMethod === 'Cash' && (
                                                                <div>
                                                                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', fontWeight: 800, color: '#475569', marginBottom: '4px' }}>
                                                                        <span>TENDERED:</span>
                                                                        <span style={{ color: '#4f46e5', fontSize: '14px' }}>{currency} {tillCashTendered || '0.00'}</span>
                                                                    </div>

                                                                    <div className="tender-grid">
                                                                        <button className="tender-btn" onClick={() => handleKeypadPress("Exact", tot)}>Exact</button>
                                                                        <button className="tender-btn" onClick={() => setTillCashTendered((Math.ceil(tot / 100) * 100).toString())}>+100</button>
                                                                        <button className="tender-btn" onClick={() => setTillCashTendered((Math.ceil(tot / 500) * 500).toString())}>+500</button>
                                                                        <button className="tender-btn" onClick={() => setTillCashTendered((Math.ceil(tot / 1000) * 1000).toString())}>+1000</button>

                                                                                {k}
                                                                            </button>
                                                                        ))}

                                                                    <button className="num-btn num-btn-action" style={{ width: '100%', marginTop: '5px', padding: '5px' }} onClick={() => handleKeypadPress("C")}>

                                                                    <div className="change-banner">
                                                                        <span>Change Due:</span>
                                                                        <span style={{ fontSize: '15px' }}>{currency} {change.toFixed(2)}</span>
                                                                    </div>
                                                                </div>

                                                            <button className="btn btn-success" onClick={handleTillQuickCheckout}>

                                                                🗑️ Clear Cart
                                                            </button>

                                                    </div>

                                                    🗑️ Clear Cart
                                                </button>
                                            </div>

                                    Confirm Add-on Items
                                </h3>
                                <p style={{ fontSize: '13px', color: '#64748b', textAlign: 'center', marginTop: '4px' }}>

                                        ✕ Cancel

                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                                        <span>Total Amount:</span>
                                        <strong style={{ fontSize: '15px' }}>{currency} {completedPaymentModal.total.toFixed(2)}</strong>

                                    </div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', borderTop: '2px solid #cbd5e1', paddingTop: '8px', marginTop: '8px', color: '#047857', fontSize: '16px', fontWeight: 900 }}>
                                        <span>CHANGE DUE:</span>
                                        <span>{currency} {completedPaymentModal.change.toFixed(2)}</span>
                                    </div>
                                </div>

                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <button className="btn btn-primary" onClick={() => printReceipt(completedPaymentModal.rawOrder, { method: completedPaymentModal.method, tendered: completedPaymentModal.tendered, change: completedPaymentModal.change }, currency, taxRate)}>
                                        🖨️ Re-Print Slip
                                    </button>
                                    <button className="btn btn-success" onClick={() => setCompletedPaymentModal(null)}>
                                        ✓ Done / Next
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── SETTLED ORDERS HISTORY MODAL ── */}
                    {showDriverCash && <DriverCashModal orders={liveOrders} currency={currency} staffName={currentServer} shopName={(typeof getPosApi === "function" && getPosApi() && getPosApi().getSettings && (getPosApi().getSettings() || {}).restaurant_name) || ""} onClose={() => setShowDriverCash(false)} onDone={() => loadData()} />}
                    {showZRead && <ZReadModal orders={liveOrders} currency={currency} staffName={currentServer} shopName={(typeof getPosApi === "function" && getPosApi() && getPosApi().getSettings && (getPosApi().getSettings() || {}).restaurant_name) || ""} onClose={() => setShowZRead(false)} />}

                    {showHistoryModal && (
                        <div className="modal-overlay" onClick={() => setShowHistoryModal(false)}>
                            <div className="modal-card" onClick={e => e.stopPropagation()}>
                                <div className="modal-header">
                                    <div className="modal-title">📋 Settled Transactions History</div>
                                    <button className="modal-close" onClick={() => setShowHistoryModal(false)}>✕</button>
                                </div>
                                <div className="modal-body">
                                    {(() => {
                                        const settledOrders = liveOrders.filter(o => ["closed", "paid", "settled", "completed"].includes((o.Status || o.status || "").toLowerCase()));
                                        if (settledOrders.length === 0) {
                                            return <div style={{ textAlign: 'center', padding: '40px', color: '#888' }}>No settled orders recorded yet.</div>;
                                        }

                                        return (
                                            <table className="history-table">
                                                <thead>
                                                    <tr>
                                                        <th>Order</th>
                                                        <th>Table / Customer</th>
                                                        <th>Total</th>
                                                        <th>Time</th>
                                                        <th>Receipt</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {settledOrders.slice().reverse().map((o, idx) => (
                                                        <tr key={idx}>
                                                            <td style={{ fontWeight: 700 }}>{o.OrderID || o.orderId}</td>
                                                            <td>{parseInt(o.TableNumber) === 0 ? (o.CustomerName ? `${o.CustomerName} (Takeaway)` : 'Takeaway') : `Table ${o.TableNumber}`}</td>
                                                            <td style={{ fontWeight: 800, color: '#1e1b4b' }}>{currency} {parseFloat(o.Total || o.total || 0).toFixed(2)}</td>
                                                            <td style={{ color: '#64748b' }}>
                                                                {o.OrderTime ? new Date(o.OrderTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—'}
                                                            </td>
                                                            <td>
                                                                <button 
                                                                    className="btn btn-ghost" 
                                                                    style={{ padding: '4px 8px', fontSize: '11px', width: 'auto' }}
                                                                    onClick={() => printReceipt(o, { method: "PAID" }, currency, taxRate)}
                                                                >
                                                                    🖨️ Receipt
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        );
                                    })()}
                                </div>
                            </div>
                        </div>
                    )}

                    {notification && (
                        <div className={`notification ${notification.type}`}>
                            {notification.message}
                        </div>
                    )}
                </div>
            );
        }

        window.startWaiterApp = function() {
            ReactDOM.render(<MainApp />, document.getElementById('root'));
        };
    </script>

    <script>
    (function initAuth() {
      function start() {
        var root = document.getElementById("root");
        if (root) root.style.display = "block";
        var loader = document.getElementById("loading-placeholder");
        if (loader) loader.style.display = "none";
        
        if (typeof window.startWaiterApp === "function") {
            window.startWaiterApp();
        }

        setTimeout(function() {
          if (typeof POS_AUTH !== "undefined" && typeof POS_AUTH.renderUtilBar === "function") {
            POS_AUTH.renderUtilBar("user-badge", "waiter-app");
          }
        }, 500);
      }

      if (typeof POS_AUTH !== "undefined") {
        POS_AUTH.init("waiter-app", {
          onReady: start,
          onError: start
        });
      } else {
        start();
      }
    })();
    </script>
</body>
</html>
