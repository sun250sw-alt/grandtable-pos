                                    /* ── NEW ORDER CART BUILDING ── */
                                    <div>
                                        <div className="order-items-list" style={{ maxHeight: '160px' }}>
                                            {orderItems.map(item => (
                                                <div key={item.id} className="order-item-row">
                                                    <div>
                                                        <div className="oir-name">{item.name}</div>
                                                        <div className="oir-price">{currency} {item.price.toFixed(2)} × {item.quantity} = {currency} {(item.price * item.quantity).toFixed(2)}</div>
                                                    </div>
                                                    <div className="oir-controls">
                                                        <button className="qty-btn" onClick={() => updateQuantity(item.id, -1)}>−</button>
                                                        <span style={{ fontWeight: 800, minWidth: '18px', textAlign: 'center', fontSize: '13px' }}>{item.quantity}</span>
                                                        <button className="qty-btn" onClick={() => updateQuantity(item.id, 1)}>+</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="totals-summary">
                                            <div className="totals-row"><span>Subtotal:</span><span>{currency} {calculateTotal().toFixed(2)}</span></div>
                                            <div className="totals-row"><span>Tax ({(taxRate * 100).toFixed(0)}%):</span><span>{currency} {(calculateTotal() * taxRate).toFixed(2)}</span></div>
                                            <div className="totals-row grand-total"><span>Total:</span><span>{currency} {(calculateTotal() * (1 + taxRate)).toFixed(2)}</span></div>
                                        </div>

                                        {activeAppMode === 'till' ? (
                                            /* TILL TAKEAWAY PAYMENT */
                                            (() => {
                                                const tot = calculateTotal() * (1 + taxRate);
                                                const tendered = paymentMethod === "Cash" ? (parseFloat(tillCashTendered) || 0) : tot;
                                                const change = Math.max(0, tendered - tot);

                                                return (
                                                    <div>
                                                        <div className="payment-box">
                                                            <div style={{ display: 'flex', gap: '6px', marginBottom: '8px' }}>
                                                                <button className={`btn ${paymentMethod === 'Cash' ? 'btn-primary' : 'btn-ghost'}`} style={{ padding: '6px', fontSize: '11px' }} onClick={() => setPaymentMethod('Cash')}>💵 Cash</button>
                                                                <button className={`btn ${paymentMethod === 'Card' ? 'btn-primary' : 'btn-ghost'}`} style={{ padding: '6px', fontSize: '11px' }} onClick={() => setPaymentMethod('Card')}>💳 Card</button>
                                                            </div>

                                                            {paymentMethod === 'Cash' && (
                                                                <div>
                                                                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', fontWeight: 800, color: '#475569', marginBottom: '4px' }}>
                                                                        <span>TENDERED:</span>
                                                                        <span style={{ color: '#4f46e5', fontSize: '14px' }}>{currency} {tillCashTendered || '0.00'}</span>
                                                                    </div>

                                                                    <div className="tender-grid">
                                                                        <button className="tender-btn" onClick={() => handleKeypadPress("Exact", tot)}>Exact</button>
                                                                        <button className="tender-btn" onClick={() => setTillCashTendered((Math.ceil(tot / 100) * 100).toString())}>+100</button>
                                                                        <button className="tender-btn" onClick={() => setTillCashTendered((Math.ceil(tot / 500) * 500).toString())}>+500</button>
                                                                        <button className="tender-btn" onClick={() => setTillCashTendered((Math.ceil(tot / 1000) * 1000).toString())}>+1000</button>
                                                                    </div>

                                                                    <div className="touch-numpad">
                                                                        {["1","2","3","4","5","6","7","8","9",".","0","⌫"].map(k => (
                                                                            <button key={k} className={`num-btn ${k === "⌫" ? 'num-btn-action' : ''}`} onClick={() => handleKeypadPress(k, tot)}>
                                                                                {k}
                                                                            </button>
                                                                        ))}
                                                                    </div>
                                                                    <button className="num-btn num-btn-action" style={{ width: '100%', marginTop: '5px', padding: '5px' }} onClick={() => handleKeypadPress("C")}>
                                                                        Clear (C)
                                                                    </button>

                                                                    <div className="change-banner">
                                                                        <span>Change Due:</span>
                                                                        <span style={{ fontSize: '16px' }}>{currency} {change.toFixed(2)}</span>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>

                                                        <div className="action-stack">
                                                            <button className="btn btn-success" onClick={handleTillQuickCheckout}>
                                                                💰 Takeaway Payment & Print
                                                            </button>
                                                            <button className="btn btn-danger" style={{ padding: '7px' }} onClick={() => setOrderItems([])}>
                                                                🗑️ Clear Cart
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })()
                                        ) : (
                                            /* WAITER SEND ORDER */
                                            <div className="action-stack">
                                                <button className="btn btn-primary" onClick={handleSendToKitchen}>
                                                    📤 Send Order to Kitchen
                                                </button>
                                                <button className="btn btn-danger" style={{ padding: '7px' }} onClick={() => setOrderItems([])}>
                                                    🗑️ Clear Cart
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* ── ADD-ON CONFIRMATION MODAL ── */}
                    {addonConfirmData && (
                        <div className="modal-overlay">
                            <div className="modal-card" style={{ maxWidth: '440px', padding: '22px' }}>
                                <div style={{ fontSize: '36px', textAlign: 'center', marginBottom: '8px' }}>📤</div>
                                <h3 style={{ fontSize: '18px', fontWeight: 900, color: '#1e1b4b', textAlign: 'center' }}>
                                    Confirm Add-on Items
                                </h3>
                                <p style={{ fontSize: '13px', color: '#64748b', textAlign: 'center', marginTop: '4px' }}>
                                    Are you sure you want to add the following items to <strong>Table {addonConfirmData.tableNumber}</strong>?
                                </p>

                                <div style={{ background: '#f8fafc', borderRadius: '10px', padding: '12px', margin: '14px 0', border: '1px solid #e2e8f0', maxHeight: '160px', overflowY: 'auto' }}>
                                    {addonConfirmData.items.map((it, idx) => (
                                        <div key={idx} style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px', padding: '4px 0', borderBottom: '1px dashed #e2e8f0' }}>
                                            <span>{it.quantity}× {it.name}</span>
                                            <strong style={{ color: '#1e1b4b' }}>{currency} {(it.price * it.quantity).toFixed(2)}</strong>
                                        </div>
                                    ))}
                                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px', fontWeight: 800, marginTop: '8px', paddingTop: '6px', borderTop: '1px solid #cbd5e1' }}>
                                        <span>Add-ons Total:</span>
                                        <span>{currency} {addonConfirmData.subtotal.toFixed(2)}</span>
                                    </div>
                                </div>

                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <button className="btn btn-primary" onClick={confirmAndSendAddOnToKitchen}>
                                        ✅ Yes, Send to Kitchen
                                    </button>
                                    <button className="btn btn-ghost" onClick={() => setAddonConfirmData(null)}>
                                        ✕ Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── PAYMENT SUCCESS & CHANGE MODAL ── */}
                    {completedPaymentModal && (
                        <div className="modal-overlay">
                            <div className="modal-card" style={{ maxWidth: '420px', textAlign: 'center', padding: '24px' }}>
                                <div style={{ fontSize: '48px', marginBottom: '8px' }}>🎉</div>
                                <h3 style={{ fontSize: '20px', fontWeight: 900, color: '#1e1b4b' }}>Payment Complete!</h3>
                                <div style={{ fontSize: '13px', color: '#64748b', marginTop: '2px' }}>
                                    Order #{completedPaymentModal.orderId} · {completedPaymentModal.table}
                                </div>

                                <div style={{ background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '12px', padding: '14px', margin: '16px 0', textAlign: 'left', fontSize: '13px' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                                        <span>Total Amount:</span>
                                        <strong style={{ fontSize: '15px' }}>{currency} {completedPaymentModal.total.toFixed(2)}</strong>
                                    </div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                                        <span>Tendered ({completedPaymentModal.method}):</span>
                                        <span>{currency} {completedPaymentModal.tendered.toFixed(2)}</span>
                                    </div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', borderTop: '2px solid #cbd5e1', paddingTop: '8px', marginTop: '8px', color: '#047857', fontSize: '16px', fontWeight: 900 }}>
                                        <span>CHANGE DUE:</span>
                                        <span>{currency} {completedPaymentModal.change.toFixed(2)}</span>
                                    </div>
                                </div>

                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <button className="btn btn-primary" onClick={() => printReceipt(completedPaymentModal.rawOrder, { method: completedPaymentModal.method, tendered: completedPaymentModal.tendered, change: completedPaymentModal.change }, currency, taxRate)}>
                                        🖨️ Re-Print Slip
                                    </button>
                                    <button className="btn btn-success" onClick={() => setCompletedPaymentModal(null)}>
                                        ✓ Done / Next
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── SETTLED ORDERS HISTORY MODAL ── */}
                    {showHistoryModal && (
                        <div className="modal-overlay" onClick={() => setShowHistoryModal(false)}>
                            <div className="modal-card" onClick={e => e.stopPropagation()}>
                                <div className="modal-header">
                                    <div className="modal-title">📋 Settled Transactions History</div>
                                    <button className="modal-close" onClick={() => setShowHistoryModal(false)}>✕</button>
                                </div>
                                <div className="modal-body">
                                    {(() => {
                                        const settledOrders = liveOrders.filter(o => ["closed", "paid", "settled", "completed"].includes((o.Status || o.status || "").toLowerCase()));
                                        if (settledOrders.length === 0) {
                                            return <div style={{ textAlign: 'center', padding: '40px', color: '#888' }}>No settled orders recorded yet.</div>;
                                        }

                                        return (
                                            <table className="history-table">
                                                <thead>
                                                    <tr>
                                                        <th>Order</th>
                                                        <th>Table</th>
                                                        <th>Total</th>
                                                        <th>Time</th>
                                                        <th>Receipt</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {settledOrders.slice().reverse().map((o, idx) => (
                                                        <tr key={idx}>
                                                            <td style={{ fontWeight: 700 }}>{o.OrderID || o.orderId}</td>
                                                            <td>{parseInt(o.TableNumber) === 0 ? 'Takeaway' : `Table ${o.TableNumber}`}</td>
                                                            <td style={{ fontWeight: 800, color: '#1e1b4b' }}>{currency} {parseFloat(o.Total || o.total || 0).toFixed(2)}</td>
                                                            <td style={{ color: '#64748b' }}>
                                                                {o.OrderTime ? new Date(o.OrderTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—'}
                                                            </td>
                                                            <td>
                                                                <button 
                                                                    className="btn btn-ghost" 
                                                                    style={{ padding: '4px 8px', fontSize: '11px', width: 'auto' }}
                                                                    onClick={() => printReceipt(o, { method: "PAID" }, currency, taxRate)}
                                                                >
                                                                    🖨️ Receipt
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        );
                                    })()}
                                </div>
                            </div>
                        </div>
                    )}

                    {notification && (
                        <div className={`notification ${notification.type}`}>
                            {notification.message}
                        </div>
                    )}
                </div>
            );
        }

        window.startWaiterApp = function() {
            ReactDOM.render(<MainApp />, document.getElementById('root'));
        };
    </script>

    <script>
    (function initAuth() {
      function start() {
        var root = document.getElementById("root");
        if (root) root.style.display = "block";
        var loader = document.getElementById("loading-placeholder");
        if (loader) loader.style.display = "none";
        
        if (typeof window.startWaiterApp === "function") {
            window.startWaiterApp();
        }

        setTimeout(function() {
          if (typeof POS_AUTH !== "undefined" && typeof POS_AUTH.renderUtilBar === "function") {
            POS_AUTH.renderUtilBar("user-badge", "waiter-app");
          }
        }, 500);
      }

      if (typeof POS_AUTH !== "undefined") {
        POS_AUTH.init("waiter-app", {
          onReady: start,
          onError: start
        });
      } else {
        start();
      }
    })();
    </script>
</body>
</html>
